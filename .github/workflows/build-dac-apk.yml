# .github/workflows/build-dac-apk.yml — plan "dac"
# Build APK tự động mỗi khi push code dac-player.
# dac-player nằm chung repo Pocket-Personal- (subfolder), nên workflow đặt ở
# root .github/workflows/ với working-directory: dac-player.
name: Build DAC APK

on:
  push:
    branches: [main]
    paths:
      - "dac-player/**"
      - ".github/workflows/build-dac-apk.yml"
  workflow_dispatch:  # cho phép bấm tay

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dac-player

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Clone decent-player sparse (chỉ lấy libs/, tránh AGPL Felicity).
      # Pin commit đã verify (2026-10-12) để build reproducible.
      - name: Clone decent-player libs (sparse, pinned)
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/Ma145/decent-player.git decent-player
          cd decent-player
          git checkout d039f9d6b1ec30901a5cd6edf72c29cde362a549
          git sparse-checkout set libs
          ls libs/decent-usb-audio-driver \
             libs/decent-usb-audio-wrapper-media3 \
             libs/decent-media3-decoder-flac
          # Tải libflac source (xiph/flac) — cần cho CMake build native
          # (theo libs/decent-media3-decoder-flac/setup.sh)
          bash libs/decent-media3-decoder-flac/setup.sh

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        # ubuntu-latest đã có sẵn Android SDK ở /usr/local/lib/android/sdk
        # (ổn định hơn android-actions/setup-android@v3)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed | head -20

      - name: Install NDK + platform
        run: |
          # Cài NDK/platform cần thiết; bỏ qua lỗi nếu đã có
          sdkmanager "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Gradle wrapper
        # Tạo wrapper tại chỗ thay vì push file jar binary qua API
        # (tránh lỗi encode khi upload binary qua GitHub API)
        run: |
          gradle wrapper --gradle-version 9.3.1 --no-daemon
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Build debug APK
        # Build debug trước (không cần keystore). Release signing tính sau
        # khi đã có đủ 4 secrets: Dac_KEYSTORE_B64/PASSWORD/ALIAS/PASSWORD.
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build deploy APK (arm64-only)
        # 1.6: buildType "deploy" = arm64-v8a only, ký debug key — APK cho trang
        # /dac. Debug APK có thêm x86_64 (cho emulator) nên 28MB, vượt giới hạn
        # 25 MiB của Cloudflare Workers assets; bản deploy arm64-only ~25MB.
        run: ./gradlew assembleDeploy --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dac-player-apk-debug
          path: dac-player/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload deploy APK
        uses: actions/upload-artifact@v4
        with:
          name: dac-player-apk-deploy
          path: dac-player/app/build/outputs/apk/deploy/*.apk
          retention-days: 30

  # Job emulator — test 1.2 (EncryptedSharedPreferences) + instrumented test trên máy ảo.
  # Chạy sau job build (needs) để không tốn 8 phút emulator khi build đã lỗi.
  # Emulator KHÔNG test được USB DAC (không passthrough) — chỉ test UI/auth/storage.
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dac-player

    steps:
      # Dọn ổ đĩa TRƯỚC mọi step khác — chuẩn ngành (keiji, auto-mobile):
      # run #36: emulator cần 7372.80 MB nhưng chỉ còn trống 7050.26 MB → FATAL.
      # android: false là BẮT BUỘC (mặc định true sẽ xoá luôn Android SDK).
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4

      # Setup giống hệt job build (decent-player, JDK, SDK, NDK, Gradle) —
      # job này tự build test APK nên cần đủ toolchain, không dùng lại artifact.
      - name: Clone decent-player libs (sparse, pinned)
        run: |
          git clone --filter=blob:none --sparse \
            https://github.com/Ma145/decent-player.git decent-player
          cd decent-player
          git checkout d039f9d6b1ec30901a5cd6edf72c29cde362a549
          git sparse-checkout set libs
          bash libs/decent-media3-decoder-flac/setup.sh

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      # Step RIÊNG sau Setup: GITHUB_PATH chỉ có hiệu lực từ step sau,
      # nên không được gọi sdkmanager trong cùng step thêm PATH (run #35: exit 127).
      # Cài cmdline-tools;latest để có avdmanager ở cmdline-tools/latest
      # (run #34: avdmanager thiếu → AVD tạo thất bại → emulator không boot).
      - name: Install cmdline-tools;latest
        run: sdkmanager "cmdline-tools;latest"

      - name: Install NDK + platform
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --no-daemon
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # Kiểm tra KVM thật — fail sớm nếu không có, không phí 10 phút poll emulator.
          ls -l /dev/kvm

      - name: Run instrumented tests on emulator
        # reactivecircus/android-emulator-runner@v2: chuẩn hiện nay cho emulator trên GH Actions.
        # api-level 29 = minSdk của dac-player. ram-size 2048M (runner private ~7.8GB, không để 4GB).
        # script: MỘT block duy nhất, MỖI LỆNH MỘT DÒNG (action chạy từng dòng riêng,
        # không hỗ trợ line continuation với backslash, không được lặp lại key script:).
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          # BẮT BUỘC: defaults.run.working-directory KHÔNG áp cho uses: step.
          # Không set → script chạy ở repo root, ./gradlew không tồn tại → fail.
          working-directory: dac-player
          ram-size: 2048M
          # disk-size 4096M: userdata 4GB vừa với ~7GB trống
          # (run #34: mặc định cần 7372MB > 6997MB trống → FATAL, emulator chết ngay).
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
            # KHÔNG check adb sau test: connectedDebugAndroidTest gỡ app khi xong
            # (run #38: pm list packages | grep trả exit 1 vì app đã bị gỡ,
            # dù 4 test pass + BUILD SUCCESSFUL). Kết quả test nằm ở reports.

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dac-player-emulator-test-reports
          path: dac-player/app/build/reports/androidTests/connected/
          retention-days: 30
