name: Put Oxion secret to production Worker

# Workflow chay tay duy nhat de nap secret OXION_API_KEY len Worker
# production (fancy-wood-2b3c). KHONG chay theo push, KHONG checkout
# code, KHONG deploy — chi 1 buoc PUT secret qua Cloudflare API.
# Can 2 repo secret (Settings > Secrets and variables > Actions):
#   CF_API_TOKEN  (da co theo deploy-cloudflare.yml)
#   OXION_API_KEY (key 1, do chu tai khoan tu nhap)
# Ly do co workflow rieng: nap secret khong qua dashboard Cloudflare
# (luat dung 22:33 24/10), va kho bao mat cua Muse khong dua duoc
# gia tri vao body PUT (surrogate chi doi vao header Bearer cho
# host da dang ky, khong chen vao JSON body cho api.cloudflare.com).

on:
  workflow_dispatch:

jobs:
  put-secret:
    runs-on: ubuntu-latest
    steps:
      - name: PUT OXION_API_KEY to production Worker
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OXION_API_KEY: ${{ secrets.OXION_API_KEY }}
        run: |
          python3 -c 'import json,os; print(json.dumps({"name":"OXION_API_KEY","text":os.environ["OXION_API_KEY"],"type":"secret_text"}))' | curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/25b2327e932d26e5487c2ba8ad058932/workers/scripts/fancy-wood-2b3c/secrets" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @- | tee /tmp/put_resp.json | grep -q '"success":true' || { echo "PUT FAILED"; cat /tmp/put_resp.json; exit 1; }
          echo "PUT OK"
