# gradle.properties — plan "dac"
# Đồng bộ với decent-player/libs/gradle.properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# NDK phải khớp với libs (ndkVersion 29.0.14206865 trong driver module).
# Cài qua Android Studio > SDK Manager > SDK Tools > NDK.
# 2.3: AGP 9.x built-in Kotlin không cho KSP dùng kotlin.sourceSets DSL.
# Set false để KSP (Room/Hilt) hoạt động — theo hướng dẫn lỗi của Gradle.
android.disallowKotlinSourceSets=false
