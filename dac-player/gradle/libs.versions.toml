# gradle/libs.versions.toml — plan "dac"
# Tất cả version verify từ decent-player/libs (clone 2026-10-12):
# - media3 1.9.3 (libs/decent-usb-audio-wrapper-media3/build.gradle.kts)
# - core-ktx 1.18.0 (libs modules)
# - AGP 9.1.0 (libs/build.gradle.kts)
# - Java 21 (jvmToolchain(21) mọi module)
[versions]
agp = "9.1.0"
kotlin = "2.2.20"
media3 = "1.9.3"
# FFmpeg decoder: doc ma145 ghi 1.9.0+1 (org.jellyfin.media3).
# Khi build, nếu 1.9.3+1 tồn tại thì dùng cho đồng bộ — verify bằng build thật.
media3-ffmpeg-decoder = "1.9.0+1"
core-ktx = "1.18.0"
appcompat = "1.7.1"
coroutines = "1.10.2"

[libraries]
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# FFmpeg decoder cho format không phải FLAC (doc ma145 bắt buộc, vì MediaCodec
# của Android cắt 24-bit xuống 16-bit).
media3-ffmpeg-decoder = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version.ref = "media3-ffmpeg-decoder" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
