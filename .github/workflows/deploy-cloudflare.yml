name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'js/**'
      - '*.html'
      - '*.css'
      - 'icons/**'
      - 'scripts/cf_deploy.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Deploy via cf_deploy.py
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DEPLOY_SRC: ${{ github.workspace }}
        run: |
          python3 scripts/cf_deploy.py