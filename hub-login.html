<title data-i18n="doc_title">Pocket Personal - Đăng nhập</title>

<style>
/* Layout riêng của trang login — màu sắc dùng token design-system (Tinh gọn) */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--pp-font);
  color:var(--pp-ink); min-height:100vh;
  background-color:var(--pp-bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
.theme-btn{
  position:fixed;top:16px;right:16px;
  width:44px;height:44px;border-radius:50%;
  background:var(--pp-card);border:1px solid var(--pp-line);
  cursor:pointer;color:var(--pp-ink);
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--pp-shadow);
}
.theme-btn svg{width:20px;height:20px}
.login-card{max-width:400px;width:100%;padding:24px}
h1{font-size:30px;text-align:center;margin-bottom:32px;font-weight:700;letter-spacing:-.5px}
.input-row{display:flex;gap:8px;margin-bottom:16px}
.input-row input{flex:1}
label{display:block;font-size:14px;margin-bottom:6px;font-weight:500}
input{
  width:100%;height:52px;border:1px solid var(--pp-line);border-radius:var(--pp-r-md);
  padding:0 14px;font-size:16px;
  background:var(--pp-card);color:var(--pp-ink);
}
input:focus{outline:none;border-color:var(--pp-accent);box-shadow:0 0 0 3px rgba(13,157,108,.15)}
.arrow-btn{
  width:52px;height:52px;min-width:52px;border-radius:var(--pp-r-md);
  background:var(--pp-grad);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--pp-shadow);
}
.arrow-btn:hover{filter:brightness(1.05)}
.arrow-btn:active{transform:scale(.96)}
.arrow-btn:disabled{opacity:.5;cursor:not-allowed}
.arrow-btn svg{width:22px;height:22px}
.error{color:var(--pp-danger);font-size:14px;margin-bottom:16px;display:none}
.switch{margin-top:20px;text-align:center;font-size:14px;color:var(--pp-mut)}
.switch a{color:var(--pp-accent);cursor:pointer;text-decoration:none}
#passWrap{display:none}
.user-email{
  display:flex;align-items:center;gap:8px;
  background:var(--pp-card);border:1px solid var(--pp-line);border-radius:var(--pp-r-md);
  padding:12px 14px;margin-bottom:16px;font-size:15px;
}
.user-email svg{width:18px;height:18px;color:var(--pp-mut)}
.user-email .edit{margin-left:auto;color:var(--pp-accent);cursor:pointer;font-size:13px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.divider div{flex:1;height:1px;background:var(--pp-line)}
.divider span{color:var(--pp-mut);font-size:13px}
.lang-pill{display:inline-flex;border:1px solid var(--pp-line);border-radius:20px;overflow:hidden;background:var(--pp-card)}
.lang-pill button{border:none;background:transparent;padding:6px 10px;font-size:11px;font-weight:700;color:var(--pp-mut);cursor:pointer}
.lang-pill button.on{background:var(--pp-accent);color:#fff}
/* Nút Google: giữ brand Google (nền trắng theo guideline) */
.google-btn{
  width:100%;padding:14px;border:1px solid var(--pp-line);border-radius:var(--pp-r-md);
  background:#fff;color:#1a1a1a;font-size:15px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:var(--pp-shadow);font-family:var(--pp-font);
}
.google-btn:active{transform:scale(.98)}
</style>

let LANG = "vi";
try{ const v = localStorage.getItem("elab_uiLang"); if(v) LANG = JSON.parse(v); }catch(e){}
function applyLang(l){
  LANG = l;
  try{ localStorage.setItem("elab_uiLang", JSON.stringify(l)); }catch(e){}
  document.documentElement.lang = l;
  const t = I18N[l] || I18N.en;
  document.title = t.doc_title;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = t[el.dataset.i18n];
    if(v !== undefined){ if(/<[a-z][\s>]/i.test(v)) el.innerHTML = v; else el.textContent = v; }
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const v = t[el.dataset.i18nPh];
    if(v !== undefined) el.placeholder = v;
  });
  ["vi","en","zh","ko"].forEach(x=>document.getElementById("lang"+x[0].toUpperCase()+x[1]).classList.toggle("on", l===x));
  document.getElementById("title").textContent = isReg ? t.title_register : t.title_login;
}
// Expose for lang-dropdown.js
window.__elabSetLang = applyLang;

const themeBtn = document.getElementById('themeBtn');
const savedTheme = localStorage.getItem('hub_theme') || 'light';
if(savedTheme === 'dark'){
  document.body.classList.add('dark');
  themeBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
}
themeBtn.onclick = ()=>{
  const dark = document.body.classList.toggle('dark');
  themeBtn.innerHTML = dark
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  localStorage.setItem('hub_theme', dark ? 'dark' : 'light');
};

let isReg = false, pendingEmail = '';
function toggleMode(){
  isReg = !isReg;
  document.getElementById('emailStep').style.display = isReg ? 'none' : 'block';
  document.getElementById('passStep').style.display = 'none';
  document.getElementById('regForm').style.display = isReg ? 'block' : 'none';
  applyLang(LANG);
  hideError();
}
function showError(msg){
  const e = document.getElementById('error');
  e.textContent = msg; e.style.display = 'block';
}
function hideError(){ document.getElementById('error').style.display = 'none'; }

function emailNext(){
  hideError();
  const email = document.getElementById('email').value.trim().toLowerCase();
  if(!email){ showError(I18N[LANG].err_email); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ showError(I18N[LANG].err_email_valid); return; }
  pendingEmail = email;
  document.getElementById('shownEmail').textContent = email;
  document.getElementById('emailStep').style.display = 'none';
  document.getElementById('passStep').style.display = 'block';
  document.getElementById('password').focus();
}
function backToEmail(){
  document.getElementById('passStep').style.display = 'none';
  document.getElementById('emailStep').style.display = 'block';
  document.getElementById('email').focus();
}

async function googleLogin(){
    try{
      const r = await fetch("/api/auth/google");
      const j = await r.json().catch(()=>({}));
      if(j.url) location.href = j.url;
      else showError(j.error || I18N[LANG].err_google);
    }catch(e){ showError(I18N[LANG].err_failed); }
  }
async function doLogin(){
  hideError();
  const password = document.getElementById('password').value;
  if(!password){ showError(I18N[LANG].err_password); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  try{
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: pendingEmail, password})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || I18N[LANG].err_login);
    localStorage.setItem('elab_authToken', j.token);
    localStorage.setItem('elab_authUser', JSON.stringify({email: j.email, role: j.role, ageGroup: j.ageGroup}));
    location.href = '/hub.html';
  }catch(e){ showError(e.message); }
  btn.disabled = false;
}

let regEmail = '';
async function sendCode(){
  hideError();
  const email = document.getElementById('regEmail').value.trim().toLowerCase();
  if(!/^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email)){ showError(I18N[LANG].err_gmail_only); return; }
  const btn = document.getElementById('sendCodeBtn');
  btn.disabled = true;
  try{
    const r = await fetch('/api/auth/send-code', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || I18N[LANG].err_send);
    regEmail = email;
    document.getElementById('regStep1').style.display = 'none';
    document.getElementById('regStep2').style.display = 'block';
    document.getElementById('verCode').focus();
  }catch(e){ showError(e.message); }
  btn.disabled = false;
}
async function verifyCode(){
  hideError();
  const code = document.getElementById('verCode').value.trim();
  if(!code){ showError(I18N[LANG].err_code); return; }
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  try{
    const r = await fetch('/api/auth/verify-code', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: regEmail, code})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || I18N[LANG].err_code_invalid);
    document.getElementById('regStep2').style.display = 'none';
    document.getElementById('regStep3').style.display = 'block';
    document.getElementById('regPass').focus();
  }catch(e){ showError(e.message); }
  btn.disabled = false;
}
async function doRegister(){
  hideError();
  const password = document.getElementById('regPass').value;
  const dob = document.getElementById('regDob').value;
  if(!password || !dob){ showError(I18N[LANG].err_fields); return; }
  const btn = document.getElementById('regBtn');
  btn.disabled = true;
  try{
    const r = await fetch('/api/auth/register', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email: regEmail, password, dob})
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || I18N[LANG].err_register);
    // Auto-login
    pendingEmail = regEmail;
    document.getElementById('password').value = password;
    document.getElementById('shownEmail').textContent = regEmail;
    toggleMode();
    document.getElementById('emailStep').style.display = 'none';
    document.getElementById('passStep').style.display = 'block';
    doLogin();
  }catch(e){ showError(e.message); }
  btn.disabled = false;
}

applyLang(LANG);
// If already logged in, go to hub
(async ()=>{
  const token = localStorage.getItem('elab_authToken');
  if(token){
    try{
      const r = await fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+token}});
      if(r.ok) location.href = '/hub.html';
    }catch(e){}
  }
})();
</script>
