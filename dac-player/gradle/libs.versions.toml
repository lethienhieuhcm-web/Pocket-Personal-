# gradle/libs.versions.toml — plan "dac"
# Tất cả version verify từ decent-player/libs (clone 2026-10-12):
# - media3 1.9.3 (libs/decent-usb-audio-wrapper-media3/build.gradle.kts)
# - core-ktx 1.18.0 (libs modules)
# - AGP 9.1.0 (libs/build.gradle.kts)
# - Java 21 (jvmToolchain(21) mọi module)
[versions]
agp = "9.1.0"
# 2.3: Kotlin phải khớp AGP 9.x built-in (2.2.10) để KSP hoạt động.
# KSP 2.2.10-2.0.2 build cho Kotlin 2.2.10; dùng 2.2.20 gây "unexpected jvm signature V".
kotlin = "2.2.10"
media3 = "1.9.3"
core-ktx = "1.18.0"
appcompat = "1.7.1"
coroutines = "1.10.2"
recyclerview = "1.4.0"
lifecycle = "2.9.2"
# 1.4: Phase 1 Libraries — verify qua Maven Central search API (2026-10-14):
# coil 2.7.0 (latest 2.x), okhttp 4.12.0 (latest stable 4.x; 5.x là alpha),
# kotlinx-serialization-json 1.7.3. Serialization plugin = Kotlin version (2.2.20).
coil = "2.7.0"
okhttp = "4.12.0"
kotlinx-serialization-json = "1.7.3"
# 1.2: EncryptedSharedPreferences — verify thật qua Google Maven (2026-10-13):
# security-crypto 1.1.0 = stable mới nhất (release 2025-07-30).
security-crypto = "1.1.0"
# Instrumented test (emulator CI): androidx.test latest verify qua Google Maven (2026-10-13).
androidx-test = "1.7.0"
test-ext-junit = "1.3.0"
# 2.3: Phase 2 Libraries — verify qua Google Maven + Maven Central (2026-10-14):
# room 2.8.5 (latest; 2.6.1 không tương thích KSP 2.x — lỗi "unexpected jvm signature V"),
# hilt 2.60.1 (2.52 không tương thích AGP 9.x — lỗi "Android BaseExtension not found"),
# work-runtime-ktx 2.9.1, jaudiotagger 3.0.1 (net.jthink).
# KSP version = Kotlin version (2.2.20) theo doc Google.
room = "2.8.5"
hilt = "2.60.1"
workmanager = "2.9.1"
jaudiotagger = "3.0.1"
# 2.4: Credential Manager khai báo trực tiếp trong app/build.gradle.kts
# (tên "credentials" xung đột namespace trong version catalog nên không dùng catalog).
# KSP version phải khớp Kotlin built-in của AGP 9.x (2.2.10), không phải
# version khai báo trong libs.versions.toml (2.2.20).
ksp = "2.2.10-2.0.2"

[libraries]
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# 1.5: FFmpeg decoder là AAR tự build ở app/libs/media3-ffmpeg-lgpl.aar
# (implementation(files(...)) trong app/build.gradle.kts), không qua Maven.
# Jellyfin GPL (org.jellyfin.media3) đã xoá — CẤM thêm lại.
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# 1.2: mã hoá token (EncryptedSharedPreferences, MasterKey AES-256-GCM).
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
# 1.4: Phase 1 Libraries (Coil ảnh bìa + OkHttp + serialization).
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
# Instrumented test (chạy trên emulator CI).
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test" }
# 2.3: Phase 2 Libraries (Room cache + Hilt DI + WorkManager + jaudiotagger).
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Room testing (cho unit test DAO).
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workmanager" }
# jaudiotagger: đọc/ghi metadata audio (Apache license, không GPL).
jaudiotagger = { group = "net.jthink", name = "jaudiotagger", version.ref = "jaudiotagger" }
# 2.4: Credential Manager khai báo trực tiếp trong app/build.gradle.kts.

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 1.4: kotlinx.serialization — version = Kotlin version (2.2.20).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# 2.3: KSP cho Room + Hilt annotation processing. Version theo doc: Kotlin version + KSP release.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# 2.3: Hilt Gradle plugin (cần cho @HiltAndroidApp).
hilt-plugin = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
