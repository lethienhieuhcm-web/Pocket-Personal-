<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--pp-bg);color:var(--pp-ink);min-height:100vh;min-height:100dvh;padding-bottom:160px}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;position:sticky;top:0;flex-wrap:wrap;
  background:rgba(246,247,249,.95);backdrop-filter:blur(10px);z-index:10}
.back{color:var(--pp-accent);text-decoration:none;font-weight:700;font-size:var(--pp-text-sm)}
h1{font-size:var(--pp-text-lg)}
main{max-width:640px;margin:0 auto;padding:0 16px}
.greet{padding:20px 0 4px}
.greet h2{font-size:var(--pp-text-2xl);font-weight:800}
.greet p{color:var(--pp-mut);font-size:var(--pp-text-sm);margin-top:2px}
.searchbar{display:flex;gap:8px;margin:16px 0}
.searchbar input{flex:1;padding:14px 16px;border:1px solid var(--pp-line);border-radius:14px;font-size:var(--pp-text-sm);
  background:var(--pp-card);color:var(--pp-ink);outline:none}
.searchbar input::placeholder{color:var(--pp-mut)}
.searchbar button{padding:0 20px;border:none;border-radius:14px;background:var(--pp-accent);color:#fff;
  font-size:var(--pp-text-sm);font-weight:700;cursor:pointer}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}
.section-head h3{font-size:var(--pp-text-lg);font-weight:700}
.section-head a{color:var(--pp-accent);font-size:var(--pp-text-xs);text-decoration:none;font-weight:600}
.track{display:flex;align-items:center;gap:12px;padding:10px 4px;cursor:pointer;border-radius:12px}
.track:active{background:var(--pp-card)}
.track .rank{font-size:var(--pp-text-lg);font-weight:800;width:24px;text-align:center}
.track img{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--pp-card)}
.track .t-info{flex:1;min-width:0}
.track .t-title{font-weight:700;font-size:var(--pp-text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track .t-artist{font-size:var(--pp-text-xs);color:var(--pp-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.track .t-menu{background:none;border:none;color:var(--pp-mut);font-size:var(--pp-text-xl);cursor:pointer;padding:8px}
.card{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:10px 16px;border-radius:10px;border:none;background:var(--pp-card);color:var(--pp-ink);
  font-size:var(--pp-text-sm);font-weight:600;cursor:pointer}
.btn.primary{background:var(--pp-accent)}
input[type=text].dark{flex:1;padding:12px;border:1px solid var(--pp-line);border-radius:10px;font-size:var(--pp-text-sm);background:var(--pp-card);color:var(--pp-ink);outline:none}
/* Mini player */
#miniplayer{position:fixed;bottom:76px;left:12px;right:12px;z-index:30;display:none;
  background:var(--pp-card);border-radius:16px;padding:10px 14px;align-items:center;gap:12px;
  box-shadow:var(--pp-shadow-lg);border:1px solid var(--pp-line);animation:slideUp .3s ease}
#miniplayer.show{display:flex}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
#miniplayer img{width:48px;height:48px;border-radius:50%;object-fit:cover}
#miniplayer img.spin{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#miniplayer .mp-info{flex:1;min-width:0}
#miniplayer .mp-title{font-weight:700;font-size:var(--pp-text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniplayer .mp-artist{font-size:var(--pp-text-xs);color:var(--pp-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniplayer .mp-btn{background:none;border:none;color:var(--pp-ink);font-size:var(--pp-text-xl);cursor:pointer;padding:8px}
.drv{display:flex;align-items:center;gap:12px;padding:14px;background:var(--pp-card);
  border:1px solid var(--pp-line);border-radius:14px;margin-bottom:10px}
.drv-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.drv-name{font-weight:700;font-size:var(--pp-text-sm)}
.drv-sub{font-size:var(--pp-text-xs);color:var(--pp-mut)}
.drv-btn{margin-left:auto;padding:8px 16px;border-radius:10px;border:1px solid var(--pp-line);
  background:var(--pp-card);color:var(--pp-ink);font-size:var(--pp-text-xs);font-weight:700;cursor:pointer}
.drv-btn.on{background:var(--pp-grad);color:#fff;border:none}
.drv-btn:disabled{opacity:.5}
.badge-soon{margin-left:auto;font-size:var(--pp-text-xs);font-weight:700;color:var(--pp-mut);
  background:var(--pp-bg);border:1px solid var(--pp-line);padding:6px 12px;border-radius:20px}
/* Bottom nav */
#bottomnav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;
  background:rgba(246,247,249,.98);backdrop-filter:blur(10px);border-top:1px solid var(--pp-line);padding:8px 0 12px}
#bottomnav button{flex:1;background:none;border:none;color:var(--pp-mut);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-size:var(--pp-text-xs);font-weight:600}
#bottomnav button.active{color:var(--pp-ink)}
#bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:var(--pp-text-xs)}
/* Full player */
#fullplayer{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;
  background:linear-gradient(180deg,var(--pp-bg) 0%,var(--pp-bg) 100%);padding:20px}
#fullplayer.show{display:flex}
#fullplayer .fp-close{align-self:flex-end;background:none;border:none;color:var(--pp-ink);font-size:var(--pp-text-3xl);cursor:pointer}
#fullplayer .fp-art{width:280px;height:280px;border-radius:24px;margin:40px auto 24px;object-fit:cover;
  box-shadow:var(--pp-shadow-lg)}
#fullplayer .fp-art.spin{animation:spin 12s linear infinite}
#fullplayer .fp-title{text-align:center;font-size:var(--pp-text-xl);font-weight:800}
#fullplayer .fp-artist{text-align:center;color:var(--pp-mut);margin-top:6px}
#fullplayer .fp-prog{margin:32px 0 8px;height:4px;background:var(--pp-card);border-radius:2px;cursor:pointer}
#fullplayer .fp-fill{height:100%;background:var(--pp-accent);border-radius:2px;width:0%}
#fullplayer .fp-times{display:flex;justify-content:space-between;font-size:var(--pp-text-xs);color:var(--pp-mut);margin-bottom:24px}
#fullplayer .fp-controls{display:flex;align-items:center;justify-content:center;gap:24px}
#fullplayer .fp-btn{background:none;border:none;color:var(--pp-ink);cursor:pointer;font-size:var(--pp-text-3xl)}
#fullplayer .fp-btn.main{font-size:64px}
#audio{display:none}
.hint{color:var(--pp-mut);font-size:var(--pp-text-xs)}
.lang-pill{display:inline-flex;border:1px solid var(--pp-line);border-radius:20px;overflow:hidden;flex-shrink:0}
.lang-pill button{border:none;background:transparent;padding:6px 10px;font-size:var(--pp-text-xs);font-weight:700;color:var(--pp-mut);cursor:pointer}
.lang-pill button.on{background:var(--pp-accent);color:#fff}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;display:none;z-index:1000;max-width:90%;font-size:var(--pp-text-sm)}

let LANG = "vi";
try{ const v = localStorage.getItem("elab_uiLang"); if(v) LANG = JSON.parse(v); }catch(e){}
if(!I18N[LANG]) LANG = "vi";
let curTab = "search";
function applyLang(l){
  LANG = l;
  // Gốc i18n (G2): đồng bộ shared module
  if(window.__elabI18n && window.__elabI18n.setLang){ try{ window.__elabI18n.setLang(l); }catch(e){} }
  try{ localStorage.setItem("elab_uiLang", JSON.stringify(l)); }catch(e){}
  document.documentElement.lang = l;
  const t = I18N[l];
  const useShared = window.__elabI18n && window.__elabI18n.t;
  const T = function(k){
    if(useShared){
      const v = window.__elabI18n.t(k);
      if(v && v !== k) return v;
    }
    return t[k];
  };
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v=T(el.dataset.i18n); if(v!==undefined) el.textContent=v;
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const v=T(el.dataset.i18nPh); if(v!==undefined) el.placeholder=v;
  });
  ["vi","en","zh","ko"].forEach(x=>{ const b=document.getElementById("lang"+x[0].toUpperCase()+x[1]); if(b) b.classList.toggle("on", l===x); });
  const hh = new Date().getHours();
  document.getElementById('greetTitle').textContent = hh<12?T('greet_morning'):hh<18?T('greet_afternoon'):T('greet_evening');
  if(curTab==='drive') renderDriveList();
  if(curTab==='playlists') renderPlaylists();
}
// Expose for lang-dropdown.js
window.__elabSetLang = applyLang;

// Tabs
function showTab(n){
  curTab = n;
  ['search','drive','playlists','spotify'].forEach(x=>{
    document.getElementById('tab-'+x).style.display = x===n?'block':'none';
  });
  document.querySelectorAll('#bottomnav button').forEach(b=>b.classList.toggle('active', b.dataset.nav===n));
  if(n==='drive') checkGDrive();
  if(n==='playlists') renderPlaylists();
  if(n==='spotify') refreshSpotifyStatus();
}
document.querySelectorAll('#bottomnav button').forEach(b=>b.onclick=()=>showTab(b.dataset.nav));

// Player
function playAt(i){
  if(i<0||i>=queue.length) return;
  qi = i;
  const t = queue[i];
  document.getElementById('miniplayer').classList.add('show');
  ['mpArt','fpArt'].forEach(id=>document.getElementById(id).src = t.art||'');
  ['mpTitle','fpTitle'].forEach(id=>document.getElementById(id).textContent = t.title);
  ['mpArtist','fpArtist'].forEach(id=>document.getElementById(id).textContent = t.artist);
  audio.src = t.url;
  audio.play().catch(()=>{});
}
audio.onplay = ()=>{ ['mpPlay','fpPlay'].forEach(id=>document.getElementById(id).textContent='⏸');
  document.getElementById('mpArt').classList.add('spin'); document.getElementById('fpArt').classList.add('spin'); };
audio.onpause = ()=>{ ['mpPlay','fpPlay'].forEach(id=>document.getElementById(id).textContent='▶');
  document.getElementById('mpArt').classList.remove('spin'); document.getElementById('fpArt').classList.remove('spin'); };
audio.onended = ()=>playAt(qi+1);
audio.ontimeupdate = ()=>{
  if(audio.duration){
    document.getElementById('fpFill').style.width = (audio.currentTime/audio.duration*100)+'%';
    document.getElementById('fpCur').textContent = fmtT(audio.currentTime);
    document.getElementById('fpDur').textContent = fmtT(audio.duration);
  }
};
const togglePlay = ()=>audio.paused?audio.play():audio.pause();
document.getElementById('mpPlay').onclick = (e)=>{ e.stopPropagation(); togglePlay(); };
document.getElementById('fpPlay').onclick = togglePlay;
document.getElementById('fpPrev').onclick = ()=>{ audio.currentTime=Math.max(0,audio.currentTime-10); };
document.getElementById('fpNext').onclick = ()=>playAt(qi+1);
document.getElementById('fpProg').onclick = (e)=>{
  const r = e.currentTarget.getBoundingClientRect();
  if(audio.duration) audio.currentTime = (e.clientX-r.left)/r.width*audio.duration;
};
document.getElementById('miniplayer').onclick = ()=>document.getElementById('fullplayer').classList.add('show');
document.getElementById('fpClose').onclick = ()=>document.getElementById('fullplayer').classList.remove('show');
document.getElementById('mpFav').onclick = (e)=>{ e.stopPropagation();
  e.target.textContent = e.target.textContent==='♡'?'♥':'♡'; };

// Search (Audius)
const RANK_COLORS = ['#00d4ff','#ff4d6d','#a78bfa','#fbbf24','#34d399'];
async function search(q){
  const box = document.getElementById('results');
  box.innerHTML = '<p class="hint" style="text-align:center;padding:20px">'+I18N[LANG].searching+'</p>';
  try{
    const r = await fetch(`${API}/tracks/search?query=${encodeURIComponent(q)}&limit=10`);
    const j = await r.json();
    queue = (j.data||[]).map((t,i)=>({title:t.title, artist:t.user?.name||'', art:t.artwork?.['150x150']||'',
      url:`${API}/tracks/${t.id}/stream`}));
    if(!queue.length){ box.innerHTML='<p class="hint" style="text-align:center">'+I18N[LANG].no_results+'</p>'; return; }
    box.innerHTML = queue.map((t,i)=>`
      <div class="track" data-i="${i}">
        <div class="rank" style="color:${RANK_COLORS[i%5]}">${i+1}</div>
        <img src="${t.art||'/english/icons/icon-music-192.png'}" loading="lazy" alt="" data-fb="/english/icons/icon-music-192.png">
        <div class="t-info"><div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div>
        <button class="t-menu">⋮</button>
      </div>`).join('');
    box.querySelectorAll('.track').forEach(el=>el.onclick=()=>playAt(+el.dataset.i));
    // 8b 2026-10-12: artwork vỡ → fallback placeholder (không dùng onerror inline)
    box.querySelectorAll('.track img[data-fb]').forEach(img=>{
      img.addEventListener('error', ()=>{ img.src = img.dataset.fb; }, {once:true});
    });
    // 8b 2026-10-12 BUG-2: nút ⋮ không được bubble lên track (gây play nhầm)
    box.querySelectorAll('.t-menu').forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); });
  }catch(e){ box.innerHTML='<p class="hint" style="text-align:center;color:var(--pp-danger)">'+I18N[LANG].failed+'</p>'; }
}
document.getElementById('searchBtn').onclick = ()=>{
  const q = document.getElementById('searchInput').value.trim(); if(q) search(q); };
document.getElementById('searchInput').onkeydown = e=>{ if(e.key==='Enter') document.getElementById('searchBtn').click(); };

// Drive — cloud list
const DRIVES = [
  {id:'gdrive', name:'Google Drive', icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l7 12H0z"/><path d="M7 3L0 15"/></svg>`},
  {id:'dropbox', name:'Dropbox', icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5-8 4.5-8-4.5z"/><path d="M4 12l8 4.5 8-4.5"/><path d="M4 7.5v9L12 21l8-4.5v-9"/></svg>`, soon:true},
  {id:'onedrive', name:'OneDrive', icon:`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14181f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 18a4.5 4.5 0 0 0 .4-9A6 6 0 0 0 6.2 10.5 3.8 3.8 0 0 0 7 18z"/></svg>`, soon:true},
];
let gdriveConnected = false;
function renderDriveList(){
  const t = I18N[LANG];
  const box = document.getElementById('driveList');
  box.innerHTML = DRIVES.map(d=>`
    <div class="drv">
      <div class="drv-ic" style="background:#fff;border:1px solid var(--pp-line)">${d.icon}</div>
      <div><div class="drv-name">${d.name}</div><div class="drv-sub">${d.id==='gdrive' ? (gdriveConnected?t.drive_connected:t.drive_not_connected) : t.drive_soon}</div></div>
      ${d.soon
        ? `<span class="badge-soon">${t.drive_soon}</span>`
        : `<button class="drv-btn ${gdriveConnected?'':'on'}" id="gdriveBtn">${gdriveConnected?t.drive_disconnect:t.drive_connect}</button>`}
    </div>`).join('');
  const btn = document.getElementById('gdriveBtn');
  if(btn) btn.onclick = gdriveConnected ? disconnectGDrive : connectGDrive;
}
async function checkGDrive(){
  try{
    const tok = localStorage.getItem('elab_authToken');
    const r = await fetch('/api/drive/status',{headers:{'Authorization':'Bearer '+tok}});
    const j = await r.json();
    gdriveConnected = !!j.connected;
  }catch(e){ gdriveConnected = false; }
  renderDriveList();
  document.getElementById('driveFilesHead').style.display = gdriveConnected?'flex':'none';
  if(gdriveConnected) loadDriveFiles();
  else document.getElementById('driveFiles').innerHTML='';
}
async function connectGDrive(){
  try{
    const tok = localStorage.getItem('elab_authToken');
    const r = await fetch('/api/drive/auth-url?return_to='+encodeURIComponent('/music/'),{headers:{'Authorization':'Bearer '+tok}});
    const j = await r.json();
    if(j.url) location.href = j.url;
    else toast(I18N[LANG].toast_no_link);
  }catch(e){ toast(I18N[LANG].toast_conn_err); }
}
async function disconnectGDrive(){
  try{
    const tok = localStorage.getItem('elab_authToken');
    await fetch('/api/drive/disconnect',{method:'POST',headers:{'Authorization':'Bearer '+tok}});
  }catch(e){}
  checkGDrive();
}

// Drive files
async function loadDriveFiles(){
  const box = document.getElementById('driveFiles');
  box.innerHTML = '<p class="hint" style="text-align:center;padding:16px">'+I18N[LANG].loading+'</p>';
  try{
    const tok = localStorage.getItem('elab_authToken');
    const r = await fetch('/api/drive/music', {headers:{'Authorization':'Bearer '+tok}});
    const j = await r.json();
    if(j.error){ box.innerHTML=`<p class="hint" style="text-align:center">${esc(j.error)}</p>`; return; }
    queue = await Promise.all((j.files||[]).map(async f=>{
      const r2 = await fetch('/api/drive/stream/'+f.id, {headers:{'Authorization':'Bearer '+tok}});
      const j2 = await r2.json();
      return {title:f.name.replace(/\.[^.]+$/,''), artist:I18N[LANG].nav_drive, art:'', url:j2.url};
    }));
    if(!queue.length){ box.innerHTML='<p class="hint" style="text-align:center">'+I18N[LANG].no_music_drive+'</p>'; return; }
    box.innerHTML = queue.map((t,i)=>`
      <div class="track" data-i="${i}">
        <div class="rank" style="color:${RANK_COLORS[i%5]}">${i+1}</div>
        <img src="/english/icons/icon-music-192.png" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover">
        <div class="t-info"><div class="t-title">${esc(t.title)}</div><div class="t-artist">${esc(t.artist)}</div></div>
        <button class="t-menu">⋮</button>
      </div>`).join('');
    box.querySelectorAll('.track').forEach(el=>el.onclick=()=>playAt(+el.dataset.i));
    // 8b 2026-10-12 BUG-2: nút ⋮ không được bubble lên track
    box.querySelectorAll('.t-menu').forEach(btn=>btn.onclick=e=>{ e.stopPropagation(); });
  }catch(e){ box.innerHTML='<p class="hint" style="text-align:center;color:var(--pp-danger)">'+I18N[LANG].failed+'</p>'; }
}
document.getElementById('driveRefresh').onclick = (e)=>{ e.preventDefault(); loadDriveFiles(); };
checkGDrive();

// Playlists
let playlists = JSON.parse(localStorage.getItem('pp_playlists')||'[]');
document.getElementById('plCreate').onclick = async ()=>{
  const name = document.getElementById('plName').value.trim(); if(!name) return;
  playlists.push({name, tracks:[]});
  localStorage.setItem('pp_playlists', JSON.stringify(playlists));
  document.getElementById('plName').value=''; renderPlaylists();
};
function renderPlaylists(){
  const box = document.getElementById('plList');
  box.innerHTML = playlists.length ? playlists.map((p,i)=>
    `<div class="track"><div class="t-info"><div class="t-title">${esc(p.name)}</div>
    <div class="t-artist">${I18N[LANG].tracks(p.tracks.length)}</div></div></div>`).join('')
    : '<p class="hint" style="text-align:center">'+I18N[LANG].no_playlists+'</p>';
}

// Spotify
async function spApi(p, opts){
  const tok = localStorage.getItem('elab_authToken');
  const r = await fetch(p, {...(opts||{}), headers:{'Authorization':'Bearer '+tok}});
  if(!r.ok) throw new Error();
  return r.json();
}
async function refreshSpotifyStatus(){
  try{
    const j = await spApi('/api/spotify/status');
    document.getElementById('spotifyConnectCard').style.display = j.connected?'none':'block';
    document.getElementById('spotifySearchCard').style.display = j.connected?'block':'none';
  }catch(e){}
}
document.getElementById('spotifyConnect').onclick = async ()=>{
  try{ const j = await spApi('/api/spotify/auth-url'); if(j.url) location.href=j.url; }
  catch(e){ alert(I18N[LANG].spotify_not_configured); }
};
document.getElementById('spSearchBtn').onclick = async ()=>{
  const q = document.getElementById('spSearchInput').value.trim(); if(!q) return;
  try{
    const j = await spApi('/api/spotify/search?q='+encodeURIComponent(q));
    const tracks = j.tracks?.items||[];
    document.getElementById('spResults').innerHTML = tracks.map(t=>`
      <div class="track">
        <img src="${t.album?.images?.[2]?.url||''}" alt="">
        <div class="t-info"><div class="t-title">${esc(t.name)}</div>
        <div class="t-artist">${esc(t.artists?.map(a=>a.name).join(', '))}</div></div>
        <a href="${t.external_urls?.spotify}" target="_blank" style="color:#00d4ff;text-decoration:none;font-size:var(--pp-text-xs)">${I18N[LANG].open}</a>
      </div>`).join('') || '<p class="hint">'+I18N[LANG].no_results+'</p>';
  }catch(e){}
};
applyLang(LANG);
// Service worker update (Chốt A 2026-10-11): hiện banner, user bấm "Cập nhật" mới update.
// Không tự SKIP_WAITING, không tự reload (user đang nhập liệu sẽ mất dữ liệu).
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/music/sw.js",{scope:"/music/"}).then(function(reg){
    reg.addEventListener("updatefound", function(){
      var newWorker = reg.installing;
      newWorker.addEventListener("statechange", function(){
        if(newWorker.state === "installed" && navigator.serviceWorker.controller){
          showUpdateBanner(newWorker);
        }
      });
    });
  }).catch(()=>{});
}
// Banner "Có bản mới" - hiện inline, không popup/modal (chuẩn big tech)
function showUpdateBanner(newWorker){
  if(document.getElementById("sw-update-banner")) return;
  // Đọc ngôn ngữ từ localStorage (JSON hoặc chuỗi thường đều được).
  // Không dùng window.elab_uiLang vì không nơi nào gán nó.
  var _lang = "vi";
  try{ _lang = (localStorage.getItem("elab_uiLang")||"vi").replace(/"/g,""); }catch(e){}
  const lang = _lang.toLowerCase();
  const t = (typeof I18N !== "undefined" && I18N[lang]) ? I18N[lang] : (typeof I18N !== "undefined" ? I18N.vi : {});
  const banner = document.createElement("div");
  banner.id = "sw-update-banner";
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--pp-accent,#0d9d6c);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--pp-text-sm);box-shadow:0 2px 8px rgba(0,0,0,.15);";
  const msg = document.createElement("span");
  msg.textContent = t.update_available || "Có bản mới";
  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:8px;flex-shrink:0;";
  const btnUpdate = document.createElement("button");
  btnUpdate.textContent = t.update_btn || "Cập nhật";
  btnUpdate.style.cssText = "background:#fff;color:var(--pp-accent,#0d9d6c);border:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;";
  btnUpdate.addEventListener("click", function(){
    if(newWorker) newWorker.postMessage({type: "SKIP_WAITING"});
    location.reload();
  });
  const btnLater = document.createElement("button");
  btnLater.textContent = t.update_later || "Để sau";
  btnLater.style.cssText = "background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;cursor:pointer;";
  btnLater.addEventListener("click", function(){ document.body.style.paddingTop = ""; banner.remove(); });
  btns.appendChild(btnUpdate);
  btns.appendChild(btnLater);
  banner.appendChild(msg);
  banner.appendChild(btns);
  document.body.prepend(banner);
  // 8b 2026-10-12 BUG-3: banner fixed top che nút — đẩy body xuống
  document.body.style.paddingTop = banner.offsetHeight + 'px';
}
</script>
