<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--pp-bg);color:var(--pp-ink);height:100vh;height:100dvh;overflow:hidden}
.app{display:flex;height:100%}
/* Sidebar */
.sidebar{width:280px;flex-shrink:0;background:var(--pp-card);border-right:1px solid var(--pp-line);display:flex;flex-direction:column;z-index:20}
.sb-head{padding:10px;border-bottom:1px solid var(--pp-line);display:flex;gap:8px}
.newbtn{flex:1;padding:10px;border:none;border-radius:10px;background:var(--pp-grad);color:#fff;font-size:var(--pp-text-sm);font-weight:700;cursor:pointer}
.sb-list{flex:1;overflow-y:auto;padding:8px}
.sb-item{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:var(--pp-text-sm);color:var(--pp-ink)}
.sb-item:hover{background:var(--pp-bg)}
.sb-item.active{background:var(--pp-bg);font-weight:600}
.sb-item .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .del{border:none;background:none;color:var(--pp-mut);cursor:pointer;font-size:16px;line-height:1;padding:4px;flex-shrink:0}
.sb-item .del:hover{color:var(--pp-danger)}
.sb-foot{padding:10px;border-top:1px solid var(--pp-line);font-size:var(--pp-text-sm)}
.sb-foot a{color:var(--pp-mut);text-decoration:none}
/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--pp-line);background:var(--pp-card);flex-shrink:0}
.topbar h1{font-size:var(--pp-text-base);font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;flex-shrink:0;border:1px solid var(--pp-line);border-radius:10px;background:var(--pp-card);color:var(--pp-ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn svg{width:18px;height:18px}
#menuBtn{display:none}
/* Messages */
.msgs{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:var(--pp-text-base);line-height:1.55;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--pp-grad);color:#fff;border-bottom-right-radius:6px}
.msg.model{align-self:flex-start;background:var(--pp-card);border:1px solid var(--pp-line);border-bottom-left-radius:6px}
.msg.model.err{border-color:var(--pp-danger);color:var(--pp-danger)}
.msg .cursor{display:inline-block;width:8px;height:16px;background:var(--pp-accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.empty{margin:auto;text-align:center;color:var(--pp-mut);padding:24px;max-width:340px}
.empty h2{font-size:var(--pp-text-base);color:var(--pp-ink);margin-bottom:8px}
.empty p{font-size:var(--pp-text-sm);line-height:1.6}
/* Setup card */
.setup{margin:auto;width:100%;max-width:420px;padding:24px;background:var(--pp-card);border:1px solid var(--pp-line);border-radius:16px;position:relative}
.setup-x{position:absolute;top:6px;right:10px;border:none;background:none;font-size:22px;line-height:1;color:var(--pp-mut);cursor:pointer;padding:6px}
.setup-x:hover{color:var(--pp-ink)}
.keyhint{font-size:var(--pp-text-xs);color:var(--pp-mut);margin-top:4px}
.setup h2{font-size:var(--pp-text-base);margin-bottom:6px}
.setup p{font-size:var(--pp-text-sm);color:var(--pp-mut);margin-bottom:14px;line-height:1.6}
.setup label{display:block;font-size:var(--pp-text-sm);font-weight:600;margin:10px 0 4px}
.setup input{width:100%;padding:10px 12px;border:1px solid var(--pp-line);border-radius:10px;background:var(--pp-bg);color:var(--pp-ink);font-size:var(--pp-text-sm);font-family:inherit}
.setup select{width:100%;padding:10px 12px;border:1px solid var(--pp-line);border-radius:10px;background:var(--pp-bg);color:var(--pp-ink);font-size:var(--pp-text-sm);font-family:inherit}
.setup .row{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;background:var(--pp-grad);color:#fff;font-size:var(--pp-text-sm);font-weight:700;cursor:pointer}
.btn.ghost{background:var(--pp-bg);color:var(--pp-ink);border:1px solid var(--pp-line)}
/* Composer */
.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--pp-card);border-top:1px solid var(--pp-line);flex-shrink:0}
.composer .wrap{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
#input{flex:1;min-width:0;resize:none;max-height:140px;padding:11px 14px;border:1px solid var(--pp-line);border-radius:14px;background:var(--pp-bg);color:var(--pp-ink);font-size:var(--pp-text-base);font-family:inherit;line-height:1.5}
#input:focus{outline:none;border-color:var(--pp-accent)}
.sendbtn{width:46px;height:46px;flex-shrink:0;border:none;border-radius:14px;background:var(--pp-grad);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sendbtn:disabled{opacity:.4;cursor:default}
.sendbtn svg{width:20px;height:20px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;display:none;z-index:1000;max-width:90%;font-size:var(--pp-text-sm)}
@media (max-width:767px){
  #menuBtn{display:flex}
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .25s ease;box-shadow:0 0 24px rgba(0,0,0,.18)}
  .sidebar.open{transform:none}
  .msg{max-width:92%}
}

  if(window.__elabI18n && window.__elabI18n.setLang){ try{ window.__elabI18n.setLang(l); }catch(e){} }
  try{ localStorage.setItem("elab_uiLang", JSON.stringify(l)); }catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k = el.dataset.i18n, v;
    if(window.__elabI18n && window.__elabI18n.t){

    } else {
      v = I18N[l][k]; if(v) el.textContent = v;
    }
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
    var k = el.dataset.i18nPh, v;

      if(v && v !== k) el.placeholder = v;

      v = I18N[l][k]; if(v) el.placeholder = v;

async function getAi(){
  if(!aiMod) aiMod = await import('/english/js/core/aiClient.js');
  return aiMod;
}
async function getAiConfig(){
  try{
    var m = await getAi();
    // 8b: dùng endpoint/model hiệu dụng của app 'talk' (riêng hoặc dùng chung).
    var base = await m.getEffectiveEndpoint('talk'), key = await m.getUserKey(), model = await m.getEffectiveModel('talk');
    if(base && key && model) return { base: base, key: key, model: model };
  }catch(e){}
  return null;
}
function refreshSetupCard(){
  var card = document.getElementById('setupCard');
  if(!card) return;
  getAiConfig().then(function(cfg){
    var show = !cfg || setupOpen;
    card.style.display = show ? '' : 'none';
    var cb = document.getElementById('setupClose');
    if(cb) cb.style.display = cfg ? '' : 'none'; /* chưa cấu hình thì không được đóng */
    var kh = document.getElementById('setupKeyHint');
    if(kh) kh.style.display = cfg ? '' : 'none'; /* chỉ hiện "giữ key cũ" khi đã có key */
    if(show){
      getAi().then(function(m){
        // 8b: Toggle cài đặt riêng cho Talk.
        var APP='talk';
        var cBox=document.getElementById('setupCustom');
        var cHint=document.getElementById('setupShareHint');
        function updateHint(useCustom){
          if(cHint) cHint.textContent = useCustom ? t('setup_custom_hint') : t('setup_shared_hint');
        }
        function loadFields(useCustom){
          var epP = useCustom ? m.getAppEndpoint(APP).catch(function(){return null;}) : m.getBaseUrl().catch(function(){return null;});
          var moP = useCustom ? m.getAppModel(APP).catch(function(){return null;}) : m.getUserModel().catch(function(){return null;});
          epP.then(function(v){ document.getElementById('setupBase').value = v || ''; });
          moP.then(function(v){
            var sel = document.getElementById('setupModel');
            if(sel && v){
              var has = false;
              for(var i = 0; i < sel.options.length; i++) if(sel.options[i].value === v){ has = true; break; }
              if(!has){ var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); }
              sel.value = v;
            } else if(sel) sel.value = '';
          });
          updateHint(useCustom);
        }
        if(cBox){
          m.isAppCustom(APP).then(function(v){
            var useCustom=!!v;
            cBox.checked=useCustom;
            loadFields(useCustom);
          }).catch(function(){ loadFields(false); });
          cBox.onchange=function(){
            var useCustom=cBox.checked;
            if(useCustom){
              m.getBaseUrl().catch(function(){return null;}).then(function(sharedEp){
                m.getAppEndpoint(APP).catch(function(){return null;}).then(function(curEp){
                  if(sharedEp && !curEp) m.saveAppEndpoint(APP, sharedEp).catch(function(){});
                });
              });
              m.getUserModel().catch(function(){return null;}).then(function(sharedMo){
                m.getAppModel(APP).catch(function(){return null;}).then(function(curMo){
                  if(sharedMo && !curMo) m.saveAppModel(APP, sharedMo).catch(function(){});
                });
              });
            } else {
              m.deleteAppEndpoint(APP).catch(function(){});
              m.deleteAppModel(APP).catch(function(){});
            }
            loadFields(useCustom);
          };
        } else {
          loadFields(false);
        }
      });
    }
  });
}
async function saveSetup(){
  var base = document.getElementById('setupBase').value.trim();
  var key = document.getElementById('setupKey').value.trim();
  var modelSel = document.getElementById('setupModel');
  var model = modelSel.value.trim();
  // 8b: Nếu chọn "__custom__" thì lấy từ ô nhập tay.
  if(model === '__custom__'){
    var cInp = document.getElementById('setupModelCustom');
    model = cInp ? cInp.value.trim() : '';
  }
  var m = await getAi();
  var oldKey = null;
  try{ oldKey = await m.getUserKey(); }catch(e){}
  /* để trống ô key mà đã có key cũ → giữ key cũ (không bắt nhập lại) */
  if(!base || !model || (!key && !oldKey)){ toast(t('setup_empty')); return; }
  // 8b: Lưu endpoint/model theo chế độ (riêng cho Talk hoặc dùng chung). Key luôn chung.
  var useCustom = false;
  try{
    var cBox = document.getElementById('setupCustom');
    useCustom = cBox ? cBox.checked : false;
  }catch(e){}
  try{
    if(useCustom){
      await m.saveAppEndpoint('talk', base);
      await m.saveAppModel('talk', model);
    } else {
      await m.saveBaseUrl(base);
      await m.saveUserModel(model);
    }
    if(key) await m.saveUserKey(key);
    document.getElementById('setupKey').value = '';
    setupOpen = false;
    toast(t('setup_ok'));
    refreshSetupCard();
  }catch(e){
    toast(t(e && e.message === 'invalid-url' ? 'setup_badurl' : 'err_send'));
  }
}
async function testSetup(){
  var base = document.getElementById('setupBase').value.trim();
  var key = document.getElementById('setupKey').value.trim();
  var m = await getAi();
  /* Y chang file: key nằm phía server nên LOAD không cần nhập lại.
     Bản web: ô trống → dùng key đã lưu trong máy. */
  if(!key){ try{ key = await m.getUserKey() || ''; }catch(e){} }
  if(!base || !key){ toast(t('setup_empty')); return; }
  toast(t('setup_testing'));
  try{
    /* Y chang loadModels() của file: GET /proxy/models → điền <select>. */
    var ids = await m.proxyModels({ baseUrl: base, key });
    var sel = document.getElementById('setupModel');
    if(sel){
      while(sel.options.length > 1) sel.remove(1);
      ids.forEach(function(id){
        var o = document.createElement('option'); o.value = id; o.textContent = id; sel.appendChild(o);
      });
      var saved = '';
      try{ saved = await m.getUserModel() || ''; }catch(e){}
      var next = (saved && ids.indexOf(saved) >= 0) ? saved : (ids[0] || '');
      sel.value = next;
      if(next) try{ await m.saveUserModel(next); }catch(e){}
    }
    toast(t('setup_test_ok').replace('{n}', ids.length));
  }catch(e){
    toast(friendlyErr(e));
  }
}

function friendlyErr(e){
  if(!e) return t('err_send');
  if(e.code === 'invalid_key') return t('err_key');
  if(e.code === 'timeout') return t('err_timeout');
  if(e.status === 429 || e.code === 'rate-limited') return t('err_rate');
  if(e.status === 404) return t('err_notfound');
  if(e.status === 400) return t('err_badreq');
  if(e instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(String((e && e.message) || '')))
    return t('err_network');
  if(e.status) return t('err_status').replace('{s}', e.status) + (e.detail ? ' ' + e.detail : '');
  return t('err_send');
}

async function send(){
  var text = input.value.trim();
  if(!text){ toast(t('err_empty')); return; }
  if(sending) return;
  var cfg = await getAiConfig();
  if(!cfg){ toast(t('err_noconfig')); refreshSetupCard(); scrollBottom(); return; }
  sending = true; setSendingUI(true);
  var chat = currentChat() || newChat();
  chat.messages.push({ role: 'user', text: text });
  if(chat.messages.length === 1) chat.title = text.slice(0, 42);
  input.value = ''; autoresize();
  var box = document.getElementById('msgs');
  var emptyEl = box.querySelector('.empty');
  if(emptyEl) emptyEl.remove();
  box.appendChild(msgEl('user', text, false));
  /* tốc T2: streaming — hiện con trỏ nhấp nháy, chữ chảy dần thay vì chờ full response. */
  var ab = msgEl('model', '…', true);
  box.appendChild(ab);
  scrollBottom();
  persistChats(); renderList();
  try{
    var m = await getAi();
    var hist = chat.messages.slice(-20);
    var maxToks = 2048;
    try{ maxToks = parseInt(localStorage.getItem('talk_response_length') || '2048', 10) || 2048; }catch(e){}
    var tokStarted = false;
    var answer = await m.proxyChat({ baseUrl: cfg.base, key: cfg.key, model: cfg.model, messages: hist, maxTokens: maxToks,
      onToken: function(chunk){
        if(!tokStarted){ tokStarted = true; ab._body.textContent = ''; }
        ab._body.textContent += chunk;
        scrollBottom();
      } });
    ab._body.textContent = answer;
    var cur = ab.querySelector('.cursor'); if(cur) cur.remove();
    chat.messages.push({ role: 'model', text: answer });
  }catch(e){
    ab.classList.add('err');
    ab._body.textContent = friendlyErr(e);
  }
  chat.updatedAt = Date.now();
  persistChats(); renderList();
  sending = false; setSendingUI(false);
  input.focus();
}

function showUpdateBanner(nw){
  if(document.getElementById('sw-update-banner')) return;
  var banner = document.createElement('div');
  banner.id = 'sw-update-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--pp-accent,#4f7cff);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--pp-text-sm);box-shadow:0 2px 8px rgba(0,0,0,.15);';
  var msg = document.createElement('span');
  msg.textContent = t('update_available');
  var btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:8px;flex-shrink:0;';
  var b1 = document.createElement('button');
  b1.textContent = t('update_btn');
  b1.style.cssText = 'background:#fff;color:var(--pp-accent,#4f7cff);border:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;';
  b1.addEventListener('click', function(){ if(nw) nw.postMessage({type:'SKIP_WAITING'}); });
  var b2 = document.createElement('button');
  b2.textContent = t('update_later');
  b2.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;cursor:pointer;';
  b2.addEventListener('click', function(){ banner.remove(); });
  btns.appendChild(b1); btns.appendChild(b2);
  banner.appendChild(msg); banner.appendChild(btns);
  document.body.prepend(banner);
  document.body.style.paddingTop = banner.offsetHeight + 'px';
}
</script>
