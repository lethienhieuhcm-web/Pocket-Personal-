<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Upgrade — Pocket Personal</title>
<link rel="stylesheet" href="/design-system.css?v=1791347000">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--pp-bg);color:var(--pp-ink);padding:12px;max-width:640px;margin:0 auto;min-height:100dvh}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.topbar a{color:var(--pp-mut);text-decoration:none;font-size:var(--pp-text-sm);font-weight:600}
.lang-pill{display:inline-flex;border:1px solid var(--pp-line);border-radius:20px;overflow:hidden}
.lang-pill button{border:none;background:transparent;padding:6px 12px;font-size:var(--pp-text-xs);font-weight:700;color:var(--pp-mut);cursor:pointer}
.lang-pill button.on{background:var(--pp-accent);color:#fff}
.card{background:var(--pp-card);border:1px solid var(--pp-line);border-radius:16px;padding:16px;margin-bottom:12px}
.hint{color:var(--pp-mut);font-size:var(--pp-text-xs);line-height:1.5}
.btn{display:inline-block;padding:12px 16px;border:1px solid var(--pp-line);border-radius:12px;background:var(--pp-card);color:var(--pp-ink);font-size:var(--pp-text-sm);font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--pp-grad);color:#fff;border:none}
.plan-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.plan-card{position:relative;text-align:center;padding:20px 12px}
.plan-card.hot{border:2px solid var(--pp-accent)}
.plan-name{font-weight:700;font-size:var(--pp-text-base)}
.plan-price{font-size:var(--pp-text-2xl);font-weight:800;color:var(--pp-accent);margin:8px 0}
.plan-price .per{font-size:var(--pp-text-xs);font-weight:600;color:var(--pp-mut)}
.plan-feats{text-align:left;margin:0 0 12px;padding:0;list-style:none}
.plan-feats li{font-size:var(--pp-text-xs);color:var(--pp-ink);line-height:1.5;margin-bottom:6px;padding-left:16px;position:relative}
.plan-feats li::before{content:"";position:absolute;left:2px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--pp-accent)}
.pop-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--pp-accent);color:#fff;font-size:var(--pp-text-xs);font-weight:700;padding:2px 10px;border-radius:10px;white-space:nowrap}
.kv{margin-bottom:8px;font-size:var(--pp-text-sm)}
.kv b{color:var(--pp-mut);font-weight:600}
code.transfer{background:var(--pp-bg);padding:4px 10px;border-radius:6px;font-size:var(--pp-text-sm);font-weight:700}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pp-accent);margin-right:6px}
h2{font-size:var(--pp-text-lg);margin-bottom:10px}
</style>
</head>
<body>
<div class="topbar">
  <a href="/hub">← Pocket Personal</a>
  <div class="pp-langdrop" id="langDrop">
    <button class="pp-langdrop-btn" aria-label="Language">
      <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="pp-langdrop-cur">VI</span>
      <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="pp-langdrop-menu" role="listbox">
      <button class="pp-langdrop-item" data-lang="vi"><span class="code">VI</span><span class="name">Tiếng Việt</span></button>
      <button class="pp-langdrop-item" data-lang="en"><span class="code">EN</span><span class="name">English</span></button>
      <button class="pp-langdrop-item" data-lang="zh"><span class="code">中文</span><span class="name">中文</span></button>
      <button class="pp-langdrop-item" data-lang="ko"><span class="code">한국어</span><span class="name">한국어</span></button>
    </div>
  </div>
</div>

<div id="loginPrompt" class="card" style="display:none;text-align:center">
  <p class="hint" style="margin-bottom:12px" data-i18n="needLogin">Bạn cần đăng nhập để nâng cấp.</p>
  <a class="btn primary" href="/login" data-i18n="loginBtn">Đăng nhập</a>
</div>

<div id="main" style="display:none">
  <div class="card">
    <h2 data-i18n="currentPlan">Gói hiện tại</h2>
    <div id="planStatus" class="hint">…</div>
  </div>

  <div class="card">
    <h2 data-i18n="choosePlan">Chọn gói</h2>
    <div class="plan-grid" id="planCards"></div>
  </div>

  <div class="card" id="payInfo" style="display:none">
    <h2 data-i18n="payTitle">Thông tin chuyển khoản</h2>
    <div id="payDetails"></div>
  </div>
</div>

let LANG = "vi";
try{ const v = localStorage.getItem("elab_uiLang"); if(v) LANG = JSON.parse(v); }catch(e){}
const t = k => (I18N[LANG] && I18N[LANG][k]) || I18N.en[k] || k;

function getAuth(){
  let token = null, email = "";
  try{ token = localStorage.getItem("elab_authToken")||null; }catch(e){}
  try{ const u = JSON.parse(localStorage.getItem("elab_authUser")||"null"); if(u && u.email) email = u.email; }catch(e){}
  return {token, email};
}

function renderPlans(){
  const box = document.getElementById("planCards");
  box.innerHTML = PLANS.map(p=>{
    const isCurrent = (p.id === currentPlanId) || (p.id === "free" && !currentPlanId);
    const feats = (p.feats||[]).map(k=>`<li>${t(k)}</li>`).join("");
    const per = p.id === "free" ? "" : `<span class="per">${t("perMonth")}</span>`;
    let btn = "";
    if(p.id === "free"){
      if(isCurrent) btn = `<button class="btn" disabled style="width:100%;opacity:.6">${t("usingNow")}</button>`;
    }else if(isCurrent){
      btn = `<button class="btn" disabled style="width:100%;opacity:.6">${t("usingNow")}</button>`;
    }else{
      btn = `<button class="btn ${p.hot?'primary':''} choose-plan" data-plan="${p.id}" style="width:100%">${t("choose")}</button>`;
    }
    return `
    <div class="card plan-card ${p.hot?'hot':''}">
      ${p.hot?`<div class="pop-badge">${t("popular")}</div>`:""}
      <div class="plan-name">${t("p_"+p.id)}</div>
      <div class="plan-price">${p.price}${per}</div>
      <ul class="plan-feats">${feats}</ul>
      ${btn}
    </div>`;
  }).join("");
  box.querySelectorAll(".choose-plan").forEach(b=>{
    b.onclick = ()=>{
      const p = PLANS.find(x=>x.id===b.dataset.plan);
      const {email} = getAuth();
      const payBox = document.getElementById("payInfo");
      payBox.style.display = "block";
      document.getElementById("payDetails").innerHTML = `
        <div class="kv"><b>${t("lblPlan")}:</b> ${t("p_"+p.id)} — ${p.price}${p.id==="free"?"":t("perMonth")}</div>
        <div class="kv"><b>${t("lblBank")}:</b> ${PAY.bank}</div>
        <div class="kv"><b>${t("lblAccount")}:</b> ${PAY.account}</div>
        <div class="kv"><b>${t("lblName")}:</b> ${PAY.name}</div>
        <div class="kv" style="margin-bottom:12px"><b>${t("lblNote")}:</b>
          ${email ? `<code class="transfer">${PAY.notePrefix} ${email}</code>` : `<span class="hint">${t("loginFirst")}</span>`}
        </div>
        <div class="hint">${t("activateNote")}</div>`;
      payBox.scrollIntoView({behavior:"smooth"});
    };
  });
}

async function loadPlanStatus(){
  const {token} = getAuth();
  const el = document.getElementById("planStatus");
  currentPlanId = "free";
  if(!token){ el.textContent = t("freePlan"); renderPlans(); return; }
  try{
    const r = await fetch("/api/user/plan", {headers:{"Authorization":"Bearer "+token}});
    if(!r.ok) throw 0;
    const j = await r.json();
    if(!j.plan || j.plan==="free"){ el.textContent = t("freePlan"); renderPlans(); return; }
    currentPlanId = j.plan;
    const name = t("p_"+j.plan) || j.plan;
    let status;
    if(j.plan === "admin") status = t("adminUnlimited").replace("{p}", name);
    else if(j.days_left > 0) status = t("paidUntil").replace("{p}",name).replace("{d}",j.days_left);
    else status = t("expired").replace("{p}",name);
    el.innerHTML = `<span class="status-dot"></span>` + status;
  }catch(e){ el.textContent = t("freePlan"); }
  renderPlans();
}

function applyLang(l){
  LANG = l;
  try{ localStorage.setItem("elab_uiLang", JSON.stringify(l)); }catch(e){}
  document.documentElement.lang = l;
  document.title = t("title") + " — Pocket Personal";
  document.querySelectorAll("[data-i18n]").forEach(el=>{ const v = t(el.dataset.i18n); if(v!==el.dataset.i18n) el.textContent = v; });
  ["vi","en","zh","ko"].forEach(x=>{ const b=document.getElementById("lang"+x[0].toUpperCase()+x[1]); if(b) b.classList.toggle("on", l===x); });
  renderPlans();
  loadPlanStatus();
}
// Expose for lang-dropdown.js
window.__elabSetLang = applyLang;


(function init(){
  const {token} = getAuth();
  document.getElementById("loginPrompt").style.display = token ? "none" : "block";
  document.getElementById("main").style.display = token ? "block" : "none";
  applyLang(LANG);
})();
</script>
