.statusbar .dot{width:8px;height:8px;border-radius:50%;background:var(--pp-accent);flex-shrink:0}

var curLang = 'vi';
function t(k){
  // Gốc i18n (G2): ưu tiên shared module, fallback dict inline.
  if(window.__elabI18n && window.__elabI18n.t){
    try{ window.__elabI18n.setLang(curLang); }catch(e){}
    var v = window.__elabI18n.t(k);
    if(v && v !== k) return v;
  }
  return (I18N[curLang] && I18N[curLang][k]) || I18N.vi[k] || k;
}
function applyLang(l){
  if(!I18N[l]) l = 'vi';
  curLang = l;
  if(window.__elabI18n && window.__elabI18n.setLang){ try{ window.__elabI18n.setLang(l); }catch(e){} }
  try{ localStorage.setItem("elab_uiLang", JSON.stringify(l)); }catch(e){}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var k = el.dataset.i18n, v;
    if(window.__elabI18n && window.__elabI18n.t){
      v = window.__elabI18n.t(k);
      if(v && v !== k) el.textContent = v;
    } else {
      v = I18N[l][k]; if(v) el.textContent = v;
    }
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
    var k = el.dataset.i18nPh, v;
    if(window.__elabI18n && window.__elabI18n.t){
      v = window.__elabI18n.t(k);
      if(v && v !== k) el.placeholder = v;
    } else {
      v = I18N[l][k]; if(v) el.placeholder = v;
    }
  });
  document.querySelectorAll("[data-i18n-aria]").forEach(function(el){
    var k = el.dataset.i18nAria, v;
    if(window.__elabI18n && window.__elabI18n.t){
      v = window.__elabI18n.t(k);
      if(v && v !== k) el.setAttribute('aria-label', v);
    } else {
      v = I18N[l][k]; if(v) el.setAttribute('aria-label', v);
    }
  });
  try{ if(window.__hbSyncModeBtn) window.__hbSyncModeBtn(); }catch(e){}
  refreshQuota();
}
window.__elabSetLang = applyLang;
(function(){ try{ var v = localStorage.getItem("elab_uiLang"); applyLang(v?JSON.parse(v):"vi"); }catch(e){ applyLang("vi"); } })();

/* Toast (inline, không popup) */
var toastTimer = null;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.style.display = 'none'; }, 2600);
}

/* Auth */
function getToken(){
  try{ return localStorage.getItem('elab_authToken') || ''; }catch(e){ return ''; }
}
function b64url(s){
  var bytes = new TextEncoder().encode(s), bin = '';
  for(var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64url(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length % 4) s += '=';
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* Browse */
var view = document.getElementById('view');
var emptyBox = document.getElementById('empty');
var addrInput = document.getElementById('addrInput');
var hostLine = document.getElementById('hostLine');
var loadingBox = document.getElementById('loading');
function showLoading(){ loadingBox.style.display = 'flex'; }
function hideLoading(){ loadingBox.style.display = 'none'; }

function normalizeUrl(raw){
  raw = (raw||'').trim();
  if(!raw) return null;
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw)) raw = 'https://' + raw;
  try{
    var u = new URL(raw);
    if(u.protocol !== 'http:' && u.protocol !== 'https:') return null;
    return u.href;
  }catch(e){ return null; }
}
function openUrl(raw){
  var href = normalizeUrl(raw);
  if(!href){ toast(t('err_badurl')); return; }
  var tok = getToken();
  if(!tok){ toast(t('err_login')); location.href = '/login'; return; }
  emptyBox.style.display = 'none';
  view.style.display = '';
  showLoading();
  // Không cập nhật thanh địa chỉ ngay (optimistic) — chỉ đồng bộ khi trang
  // thực sự tải xong trong syncFromIframe. Như vậy thanh địa chỉ luôn trung
  // thực với nội dung đang hiển thị (kiểu Safari), tránh lệch khi navigation
  // fail/không commit.
  view.src = '/api/browse?url=' + b64url(href) + '&t=' + encodeURIComponent(tok);
}
document.getElementById('goBtn').onclick = function(){
  if(hbMode){ hbRestart(); return; } // che do tuong tac: mo session moi o URL moi
  openUrl(addrInput.value);
};
addrInput.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(hbMode){ hbRestart(); return; }
  openUrl(addrInput.value);
});
document.getElementById('backBtn').onclick = function(){ try{ view.contentWindow.history.back(); }catch(e){} };
document.getElementById('fwdBtn').onclick = function(){ try{ view.contentWindow.history.forward(); }catch(e){} };
document.getElementById('reloadBtn').onclick = function(){ showLoading(); try{ view.contentWindow.location.reload(); }catch(e){ hideLoading(); } };

/* Che do Tuong tac (Hyperbeam) — Henrry Chot 19/10.
   Worker tao session (key nam o secret), client chi nhan embed_url
   roi render bang SDK chinh hang @hyperbeam/web. */
var hbWrap = document.getElementById('hbWrap');
var hbContainer = document.getElementById('hbContainer');
var modeBtn = document.getElementById('modeBtn');
var hbSessionId = null, hbClient = null, hbMode = false;

function syncModeBtn(){
  modeBtn.textContent = t(hbMode ? 'mode_stop' : 'mode_interactive');
  modeBtn.classList.toggle('active', !!hbMode);
}
window.__hbSyncModeBtn = syncModeBtn;

function setNavEnabled(on){
  ['backBtn','fwdBtn','reloadBtn'].forEach(function(id){
    try{ document.getElementById(id).disabled = !on; }catch(e){}
  });
}

function hbCleanup(silent){
  hbSessionId = null; hbClient = null; hbMode = false;
  try{ hbContainer.innerHTML = ''; }catch(e){}
  hbWrap.style.display = 'none';
  emptyBox.style.display = '';
  view.style.display = 'none';
  setNavEnabled(true);
  hostLine.textContent = '';
  try{ document.getElementById('proxyLabel').textContent = t('proxy_on'); }catch(e){}
  try{ document.getElementById('loadingText').textContent = t('loading'); }catch(e){}
  syncModeBtn();
  if(!silent) toast(t('hb_ended'));
}

async function hbStart(){
  if(hbMode) return;
  var tok = getToken();
  if(!tok){ toast(t('err_login')); location.href = '/login'; return; }
  var href = normalizeUrl(addrInput.value) || 'https://example.com';
  emptyBox.style.display = 'none';
  view.style.display = 'none';
  hbWrap.style.display = '';
  try{ document.getElementById('loadingText').textContent = t('hb_creating'); }catch(e){}
  showLoading();
  try{
    var r = await fetch('/api/hb/session', {
      method: 'POST',
      headers: {'Authorization':'Bearer '+tok, 'Content-Type':'application/json'},
      body: JSON.stringify({start_url: href})
    });
    if(r.status === 501){ hideLoading(); hbCleanup(true); toast(t('hb_noconfig')); return; }
    if(!r.ok){ hideLoading(); hbCleanup(true); toast(t('hb_failed')); return; }
    var j = await r.json();
    if(!j.embed_url || !j.session_id){ hideLoading(); hbCleanup(true); toast(t('hb_failed')); return; }
    hbSessionId = j.session_id;
    var mod = await import('https://unpkg.com/@hyperbeam/web@latest/dist/index.js');
    var Hyperbeam = mod.default || mod.Hyperbeam;
    hbClient = await Hyperbeam(hbContainer, j.embed_url, {
      onDisconnect: function(){ hbCleanup(false); }
    });
    hbMode = true;
    setNavEnabled(false);
    hideLoading();
    try{ document.getElementById('loadingText').textContent = t('loading'); }catch(e){}
    try{ document.getElementById('proxyLabel').textContent = t('hb_via'); }catch(e){}
    hostLine.textContent = new URL(href).hostname + ' · ' + t('mode_interactive');
    syncModeBtn();
  }catch(e){
    hideLoading(); hbCleanup(true); toast(t('hb_failed'));
  }
}

async function hbStop(silent){
  var tok = getToken();
  var sid = hbSessionId;
  hbSessionId = null;
  if(sid && tok){
    try{
      await fetch('/api/hb/session?id=' + encodeURIComponent(sid), {
        method: 'DELETE', headers: {'Authorization':'Bearer '+tok}
      });
    }catch(e){}
  }
  hbCleanup(silent);
}

async function hbRestart(){ await hbStop(true); hbStart(); }

modeBtn.onclick = function(){
  if(hbMode){ hbStop(false); }
  else { hbStart(); }
};
syncModeBtn();

/* Đồng bộ thanh địa chỉ theo trang trong iframe (same-origin nên đọc được) */
function syncFromIframe(){
  hideLoading();
  try{
    var href = view.contentWindow.location.href;
    var m = href.match(/[?&]url=([^&]+)/);
    if(m){
      try{
        var real = unb64url(decodeURIComponent(m[1]));
        addrInput.value = real;
        hostLine.textContent = new URL(real).hostname;
      }catch(e){}
    }
    refreshQuota();
  }catch(e){}
}
function onIframePageShow(){ syncFromIframe(); }
view.addEventListener('load', function(){
  syncFromIframe();
  // bfcache restore (back/forward) không fire 'load' mà fire 'pageshow'
  try{
    var cw = view.contentWindow;
    cw.removeEventListener('pageshow', onIframePageShow);
    cw.addEventListener('pageshow', onIframePageShow);
  }catch(e){}
});

/* Quota hôm nay */
function refreshQuota(){
  var tok = getToken();
  if(!tok) return;
  fetch('/api/user/usage', {headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && typeof j.browse_pages === 'number'){
        var line;
        if(j.browse_limit === null || j.browse_limit === undefined){
          line = t('quota_unlimited');
        }else{
          var left = Math.max(0, j.browse_limit - j.browse_pages);
          line = t('quota_left').replace('{n}', left).replace('{m}', j.browse_limit);
        }
        document.getElementById('quotaLine').textContent = line;
      }
    }).catch(function(){});
}

/* Kiểm tra đăng nhập */
(function(){
  var tok = getToken();
  if(!tok){ location.href = '/login'; return; }
  fetch('/api/auth/me', {headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){
      if(r.status === 401){ try{localStorage.removeItem('elab_authToken');}catch(e){} location.href = '/login'; }
      else refreshQuota();
    }).catch(function(){});
})();

/* Service worker (8b.4: không skipWaiting trong install, chờ user bấm Cập nhật) */
var swRefreshing = false;
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/browser/sw.js', {scope:'/browser/'}).then(function(reg){
    reg.addEventListener('updatefound', function(){
      var nw = reg.installing;
      nw.addEventListener('statechange', function(){
        if(nw.state === 'installed' && navigator.serviceWorker.controller){
          showUpdateBanner(nw);
        }
      });
    });
  }).catch(function(){});
  // Reload khi SW mới đã kiểm soát trang (đúng chuẩn, không race)
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(swRefreshing) return;
    swRefreshing = true;
    location.reload();
  });
}
function showUpdateBanner(nw){
  if(document.getElementById('sw-update-banner')) return;
  var banner = document.createElement('div');
  banner.id = 'sw-update-banner';
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--pp-accent,#0d9d6c);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--pp-text-sm);box-shadow:0 2px 8px rgba(0,0,0,.15);';
  var msg = document.createElement('span');
  msg.textContent = t('update_available');
  var btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:8px;flex-shrink:0;';
  var b1 = document.createElement('button');
  b1.textContent = t('update_btn');
  b1.style.cssText = 'background:#fff;color:var(--pp-accent,#0d9d6c);border:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;';
  b1.addEventListener('click', function(){ if(nw) nw.postMessage({type:'SKIP_WAITING'}); });
  var b2 = document.createElement('button');
  b2.textContent = t('update_later');
  b2.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;cursor:pointer;';
  b2.addEventListener('click', function(){ banner.remove(); });
  btns.appendChild(b1); btns.appendChild(b2);
  banner.appendChild(msg); banner.appendChild(btns);
  document.body.prepend(banner);
  // 8b 2026-10-12 BUG-3: banner fixed top che nút — đẩy body xuống
  document.body.style.paddingTop = banner.offsetHeight + 'px';
}
