name = "fancy-wood-2b3c"
main = "worker.js"
compatibility_date = "2024-10-01"

[assets]
directory = "./"
not_found_handling = "single-page-application"
exclude = [
  ".git",
  ".github",
  "node_modules",
  "worker/node_modules",
  "worker/src",
  "scripts",
  "*.md",
  "*.py",
  "*.sh",
  "wrangler.toml",
  ".gitignore",
]

[[r2_buckets]]
binding = "DATA"
bucket_name = "english-lab-data"

[[r2_buckets]]
binding = "AUTHDB"
bucket_name = "english-lab-auth"

[[d1_databases]]
binding = "DB"
database_id = "e856db4d-1ee1-42fd-9c1d-1807ca31afb5"