<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess — Pocket Personal</title>
<link rel="manifest" href="/chess/manifest.json">
<meta name="theme-color" content="#0d9d6c">
<link rel="stylesheet" href="/design-system.css">
<style>
:root{--bg:var(--pp-bg);--card:var(--pp-card);--card2:var(--pp-bg2);--ink:var(--pp-ink);
  --mut:var(--pp-mut);--line:var(--pp-line);--accent:var(--pp-accent);
  --light:#ffffff;--dark:#0d9d6c}
body.dark{--bg:#1a1714;--card:#23201a;--ink:#e8e2d6;--mut:#8a847c;--line:#3d352a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:10}
.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:var(--pp-text-sm);display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:44px}
.lang-pill{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.lang-pill button{border:none;background:transparent;padding:6px 10px;font-size:var(--pp-text-xs);font-weight:700;color:var(--mut);cursor:pointer}
.lang-pill button.on{background:var(--accent);color:#fff}
h1{font-size:var(--pp-text-lg)}
main{max-width:1080px;margin:0 auto;padding:16px}
.layout{display:flex;gap:16px;align-items:flex-start}
#sideMoves{width:230px;flex-shrink:0;position:sticky;top:70px;max-height:calc(100vh - 90px);max-height:calc(100dvh - 90px);display:flex;flex-direction:column}
#sideMoves h3{font-size:var(--pp-text-sm);color:var(--mut);margin-bottom:8px;font-weight:700}
#moves{overflow-y:auto;font-size:var(--pp-text-sm);flex:1;min-height:80px}
#moves table{width:100%;border-collapse:collapse}
#moves td{padding:5px 8px;border-bottom:1px solid var(--line)}
#moves td.num{color:var(--mut);width:36px;text-align:right}
#moves tr:last-child td{background:rgba(13,157,108,.08);font-weight:700}
.board-wrap{flex:1;min-width:0}
@media(max-width:900px){
  .layout{flex-direction:column}
  #sideMoves{width:100%;position:static;max-height:220px;order:2}
  .board-wrap{width:100%;order:1}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;align-items:center}
.btn{padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:var(--pp-text-sm);font-weight:600;cursor:pointer}
.btn.primary{background:var(--pp-grad,var(--accent));color:#fff;border-color:transparent}
.btn:disabled{opacity:.5}
#board{width:100%;max-width:480px;margin:0 auto;display:block;border-radius:8px;touch-action:manipulation}
.sq{cursor:pointer}
.sq.sel{filter:brightness(1.15)}
.sq.last{filter:brightness(1.1)}
.sq.hint-dot::after{content:"";position:absolute}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:var(--pp-text-sm);min-height:44px}
#status{text-align:center;font-weight:700;margin:12px 0;min-height:24px}
#moves{max-height:120px;overflow-y:auto;font-size:var(--pp-text-sm);color:var(--mut);text-align:center}
.piece{font-size:44px;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
@media(max-width:480px){.piece{font-size:36px}}
</style>

<main>
  <div class="layout">
   <aside class="card" id="sideMoves">
     <h3 data-i18n="moves">Moves</h3>
     <div id="moves"></div>
   </aside>
   <div class="board-wrap">

<script type="module">
import { Chess } from '/english/js/vendor/chess.js';

const PIECES = {k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟',K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙'};
let game = new Chess();
let selected = null;
let orientation = 'w';
let aiThinking = false;
let lastMove = null;

// Stockfish worker
let sf = null;
function initSF(){
  try{
    sf = new Worker('https://cdn.jsdelivr.net/npm/stockfish.wasm@0.10.0/stockfish.js');
    sf.postMessage('uci');
  }catch(e){ console.log('SF failed', e); }
}

const board = document.getElementById('board');
function sqColor(f, r){ return (f + r) % 2 === 0 ? 'var(--dark)' : 'var(--light)'; }

function render(){
  board.innerHTML = '';
  for(let r=0; r<8; r++){
    for(let f=0; f<8; f++){
      const df = orientation==='w' ? f : 7-f;
      const dr = orientation==='w' ? 7-r : r;
      const sq = 'abcdefgh'[df] + (dr+1);
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','sq'+(selected===sq?' sel':'')+(lastMove&&(lastMove.from===sq||lastMove.to===sq)?' last':''));
      g.dataset.sq = sq;
      const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
      rect.setAttribute('x', f*50); rect.setAttribute('y', r*50);
      rect.setAttribute('width', 50); rect.setAttribute('height', 50);
      rect.setAttribute('fill', sqColor(df, dr));
      g.appendChild(rect);
      // hints
      if(selected){
        const moves = game.moves({square:selected, verbose:true});
        if(moves.some(m=>m.to===sq)){
          const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
          c.setAttribute('cx', f*50+25); c.setAttribute('cy', r*50+25); c.setAttribute('r', 8);
          c.setAttribute('fill', 'rgba(13,138,102,.5)');
          g.appendChild(c);
        }
      }
      const piece = game.get(sq);
      if(piece){
        const t = document.createElementNS('http://www.w3.org/2000/svg','text');
        t.setAttribute('x', f*50+25); t.setAttribute('y', f*50+27);
        t.setAttribute('y', r*50+27);
        t.setAttribute('class','piece');
        t.setAttribute('fill', piece.color==='w' ? '#ffffff' : '#14181f');
        t.setAttribute('stroke', piece.color==='w' ? '#14181f' : '#ffffff');
        t.setAttribute('stroke-width', '1.5');
        t.textContent = PIECES[piece.color==='w' ? piece.type.toUpperCase() : piece.type];
        g.appendChild(t);
      }
      g.addEventListener('click', ()=>onSq(sq));
      board.appendChild(g);
    }
  }
  updateStatus();
}

function onSq(sq){
  if(aiThinking || game.isGameOver()) return;
  const mode = document.getElementById('mode').value;
  const turn = game.turn();
  // In AI mode, only allow moving own color
  if(mode.startsWith('ai')){
    const human = orientation;
    if(turn !== human) return;
  }
  if(selected){
    try{
      const m = game.move({from:selected, to:sq, promotion:'q'});
      lastMove = m; selected = null;
      render(); updateMoves();
      maybeAi();
      return;
    }catch(e){}
  }
  const p = game.get(sq);
  selected = (p && p.color === game.turn()) ? sq : null;
  render();
}

function updateStatus(){
  const el = document.getElementById('status');
  const t = I18N[LANG];
  if(game.isCheckmate()) el.textContent = t.checkmate + (game.turn()==='w'?'Black':'White') + t.wins;
  else if(game.isDraw()) el.textContent = t.draw;
  else if(game.isStalemate()) el.textContent = t.stalemate;
  else el.textContent = (game.turn()==='w'?t.whiteToMove:t.blackToMove) + (game.inCheck()?t.check:'');
}

const SAVE_KEY = 'pp_chess_save';
function saveGame(){
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify({
    fen: game.fen(),
    history: game.history({verbose:true}).map(m=>({from:m.from, to:m.to, promotion:m.promotion})),
    mode: document.getElementById('mode').value,
    orientation
  })); }catch(e){}
}
function loadSaved(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && s.fen){
      if(s.history && s.history.length){
        game = new Chess();
        for(const m of s.history){
          try{ game.move({from:m.from, to:m.to, promotion:m.promotion||'q'}); }catch(e){ break; }
        }
      } else game.load(s.fen);
      orientation = s.orientation || 'w';
      document.getElementById('mode').value = s.mode || 'ai-medium';
      document.getElementById('orientation').value = orientation;
    }
  }catch(e){}
}
function updateMoves(){
  const h = game.history();
  const el = document.getElementById('moves');
  if(!h.length){
    el.innerHTML = `<div style="color:var(--mut);text-align:center;padding:12px">${I18N[LANG].noMoves}</div>`;
  } else {
    let s = '<table>';
    for(let i=0;i<h.length;i+=2)
      s += `<tr><td class="num">${i/2+1}.</td><td>${h[i]}</td><td>${h[i+1]||''}</td></tr>`;
    s += '</table>';
    el.innerHTML = s;
  }
  el.scrollTop = el.scrollHeight;
  saveGame();
}

function maybeAi(){
  const mode = document.getElementById('mode').value;
  if(!mode.startsWith('ai') || game.isGameOver()) return;
  if(game.turn() === orientation) return;
  aiThinking = true;
  document.getElementById('status').textContent = I18N[LANG].thinking;
  const depth = mode==='ai-easy' ? 4 : mode==='ai-medium' ? 10 : 16;
  if(sf){
    const handler = (e)=>{
      const line = e.data;
      if(line.startsWith('bestmove')){
        sf.removeEventListener('message', handler);
        const mv = line.split(' ')[1];
        if(mv && mv !== '(none)'){
          try{ lastMove = game.move({from:mv.slice(0,2), to:mv.slice(2,4), promotion:mv[4]||'q'}); }catch(e){}
        }
        aiThinking = false; render(); updateMoves();
      }
    };
    sf.addEventListener('message', handler);
    sf.postMessage('position fen ' + game.fen());
    sf.postMessage('go depth ' + depth);
    setTimeout(()=>{ if(aiThinking){ sf.removeEventListener('message', handler); aiThinking=false; randomMove(); } }, 15000);
  } else randomMove();
}

function randomMove(){
  const moves = game.moves({verbose:true});
  if(moves.length){
    const m = moves[Math.floor(Math.random()*moves.length)];
    lastMove = game.move(m);
  }
  aiThinking = false; render(); updateMoves();
}

document.getElementById('newGame').onclick = ()=>{
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  game = new Chess(); selected = null; lastMove = null; aiThinking = false;
  orientation = document.getElementById('orientation').value;
  // Check premium for hard mode
  if(document.getElementById('mode').value === 'ai-hard'){
    checkPremium().then(ok=>{ if(!ok){ document.getElementById('mode').value='ai-medium'; alert(I18N[LANG].premium); } });
  }
  render(); updateMoves();
  maybeAi();
};
document.getElementById('orientation').onchange = (e)=>{ orientation = e.target.value; render(); maybeAi(); };
document.getElementById('mode').onchange = ()=>{ document.getElementById('newGame').click(); };
document.getElementById('undoBtn').onclick = ()=>{
  game.undo();
  if(document.getElementById('mode').value.startsWith('ai')) game.undo();
  selected=null; render(); updateMoves();
};
document.getElementById('flipBtn').onclick = ()=>{ orientation = orientation==='w'?'b':'w'; document.getElementById('orientation').value = orientation; render(); };

async function checkPremium(){
  try{
    const t = localStorage.getItem('elab_authToken');
    if(!t) return false;
    const r = await fetch('/api/user/plan', {headers:{'Authorization':'Bearer '+t}});
    const j = await r.json();
    return j.plan && j.plan !== 'free';
  }catch(e){ return false; }
}

// Dark mode — FIT 8b-8: localStorage ưu tiên, fallback theme hệ thống
try{
  const s = localStorage.getItem('elab_theme');
  const dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  if(dark) document.body.classList.add('dark');
}catch(e){}

loadSaved();

const I18N = {
vi:{title:"Cờ vua",easy:"Dễ",medium:"Trung bình",hard:"Khó",twoP:"2 người chơi",
asWhite:"Cầm quân trắng",asBlack:"Cầm quân đen",newGame:"Ván mới",undo:"Hoàn nước",flip:"Xoay bàn",
moves:"Các nước đi",noMoves:"Chưa có nước đi",
whiteToMove:"Trắng đi",blackToMove:"Đen đi",check:" — chiếu!",
checkmate:"Chiếu hết! ",wins:" thắng",draw:"Hòa",stalemate:"Hòa (hết nước đi)",
thinking:"Đang nghĩ…",premium:"Chế độ Khó chưa khả dụng.",update_available:"Có bản mới",update_btn:"Cập nhật",update_later:"Để sau"},
en:{title:"Chess",easy:"Easy",medium:"Medium",hard:"Hard",twoP:"2 Players",
asWhite:"Play as White",asBlack:"Play as Black",newGame:"New game",undo:"Undo",flip:"Flip",
moves:"Moves",noMoves:"No moves yet",
whiteToMove:"White to move",blackToMove:"Black to move",check:" — check!",
checkmate:"Checkmate! ",wins:" wins",draw:"Draw",stalemate:"Stalemate",
thinking:"Thinking…",premium:"Hard mode is not available.",update_available:"New version available",update_btn:"Update",update_later:"Later"},
zh:{title:"象棋",easy:"简单",medium:"中等",hard:"困难",twoP:"双人对弈",
asWhite:"执白",asBlack:"执黑",newGame:"新对局",undo:"悔棋",flip:"翻转棋盘",
moves:"棋谱",noMoves:"暂无着法",
whiteToMove:"白方行棋",blackToMove:"黑方行棋",check:" ——将军！",
checkmate:"将死！",wins:" 获胜",draw:"和棋",stalemate:"和棋（无子可动）",
thinking:"思考中…",premium:"困难模式暂不可用。",update_available:"有新版本",update_btn:"更新",update_later:"稍后"},
ko:{title:"체스",easy:"쉬움",medium:"보통",hard:"어려움",twoP:"2인 대결",
asWhite:"백으로 두기",asBlack:"흑으로 두기",newGame:"새 게임",undo:"무르기",flip:"보드 뒤집기",
moves:"기보",noMoves:"아직 수가 없습니다",
whiteToMove:"백 차례",blackToMove:"흑 차례",check:" — 체크!",
checkmate:"체크메이트! ",wins:" 승리",draw:"무승부",stalemate:"스테일메이트",
thinking:"생각 중…",premium:"어려움 모드를 사용할 수 없습니다.",update_available:"새 버전 있음",update_btn:"업데이트",update_later:"나중에"}};
let LANG = "vi";
try{ const v = localStorage.getItem("elab_uiLang"); if(v) LANG = JSON.parse(v); }catch(e){}
function applyLang(l){
  LANG = l;
  // Gốc i18n (G2): đồng bộ shared module
  if(window.__elabI18n && window.__elabI18n.setLang){ try{ window.__elabI18n.setLang(l); }catch(e){} }
  try{ localStorage.setItem("elab_uiLang", JSON.stringify(l)); }catch(e){}
  document.documentElement.lang = l;
  const t = I18N[l];
  const useShared = window.__elabI18n && window.__elabI18n.t;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.dataset.i18n;
    if(useShared){
      const v = window.__elabI18n.t(k);
      if(v && v !== k) el.textContent = v;
    } else {
      const v = t[k]; if(v) el.textContent = v;
    }
  });
  ["vi","en","zh","ko"].forEach(x=>{ const b=document.getElementById("lang"+x[0].toUpperCase()+x[1]); if(b) b.classList.toggle("on", l===x); });
  updateStatus(); updateMoves();
}
// Expose for lang-dropdown.js
window.__elabSetLang = applyLang;
initSF();
render();
applyLang(LANG);
// Service worker update (Chốt A 2026-10-11): hiện banner, user bấm "Cập nhật" mới update.
// Không tự SKIP_WAITING, không tự reload (user đang nhập liệu sẽ mất dữ liệu).
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("/chess/sw.js",{scope:"/chess/"}).then(function(reg){
    reg.addEventListener("updatefound", function(){
      var newWorker = reg.installing;
      newWorker.addEventListener("statechange", function(){
        if(newWorker.state === "installed" && navigator.serviceWorker.controller){
          showUpdateBanner(newWorker);
        }
      });
    });
  }).catch(()=>{});
}
// Banner "Có bản mới" - hiện inline, không popup/modal (chuẩn big tech)
function showUpdateBanner(newWorker){
  if(document.getElementById("sw-update-banner")) return;
  // Đọc ngôn ngữ từ localStorage (JSON hoặc chuỗi thường đều được).
  // Không dùng window.elab_uiLang vì không nơi nào gán nó.
  var _lang = "vi";
  try{ _lang = (localStorage.getItem("elab_uiLang")||"vi").replace(/"/g,""); }catch(e){}
  const lang = _lang.toLowerCase();
  const t = (typeof I18N !== "undefined" && I18N[lang]) ? I18N[lang] : (typeof I18N !== "undefined" ? I18N.vi : {});
  const banner = document.createElement("div");
  banner.id = "sw-update-banner";
  banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:9999;background:var(--pp-accent,#0d9d6c);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:var(--pp-text-sm);box-shadow:0 2px 8px rgba(0,0,0,.15);";
  const msg = document.createElement("span");
  msg.textContent = t.update_available || "Có bản mới";
  const btns = document.createElement("div");
  btns.style.cssText = "display:flex;gap:8px;flex-shrink:0;";
  const btnUpdate = document.createElement("button");
  btnUpdate.textContent = t.update_btn || "Cập nhật";
  btnUpdate.style.cssText = "background:#fff;color:var(--pp-accent,#0d9d6c);border:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;";
  btnUpdate.addEventListener("click", function(){
    if(newWorker) newWorker.postMessage({type: "SKIP_WAITING"});
    location.reload();
  });
  const btnLater = document.createElement("button");
  btnLater.textContent = t.update_later || "Để sau";
  btnLater.style.cssText = "background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:6px 14px;cursor:pointer;";
  btnLater.addEventListener("click", function(){ document.body.style.paddingTop = ""; banner.remove(); });
  btns.appendChild(btnUpdate);
  btns.appendChild(btnLater);
  banner.appendChild(msg);
  banner.appendChild(btns);
  document.body.prepend(banner);
  // 8b 2026-10-12 BUG-3: banner fixed top che nút — đẩy body xuống
  document.body.style.paddingTop = banner.offsetHeight + 'px';
}
</script>
