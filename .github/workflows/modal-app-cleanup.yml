name: Modal App Cleanup (dispatch only)

on:
  workflow_dispatch:

jobs:
  stop-apps:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Install Modal CLI
        run: pip install modal
      - name: List apps before
        run: modal app list
      - name: Stop stock-tick-merger
        run: modal app stop -y stock-tick-merger
      - name: List apps after
        if: always()
        run: modal app list
