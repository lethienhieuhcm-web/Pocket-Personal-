# gradle/libs.versions.toml — plan "dac"
# Tất cả version verify từ decent-player/libs (clone 2026-10-12):
# - media3 1.9.3 (libs/decent-usb-audio-wrapper-media3/build.gradle.kts)
# - core-ktx 1.18.0 (libs modules)
# - AGP 9.1.0 (libs/build.gradle.kts)
# - Java 21 (jvmToolchain(21) mọi module)
[versions]
agp = "9.1.0"
kotlin = "2.2.20"
media3 = "1.9.3"
# FFmpeg decoder: doc ma145 ghi 1.9.0+1 (org.jellyfin.media3).
# Khi build, nếu 1.9.3+1 tồn tại thì dùng cho đồng bộ — verify bằng build thật.
media3-ffmpeg-decoder = "1.9.0+1"
core-ktx = "1.18.0"
appcompat = "1.7.1"
coroutines = "1.10.2"
recyclerview = "1.4.0"
lifecycle = "2.9.2"
# 1.4: Phase 1 Libraries — verify qua Maven Central search API (2026-10-14):
# coil 2.7.0 (latest 2.x), okhttp 4.12.0 (latest stable 4.x; 5.x là alpha),
# kotlinx-serialization-json 1.7.3. Serialization plugin = Kotlin version (2.2.20).
coil = "2.7.0"
okhttp = "4.12.0"
kotlinx-serialization-json = "1.7.3"
# 1.2: EncryptedSharedPreferences — verify thật qua Google Maven (2026-10-13):
# security-crypto 1.1.0 = stable mới nhất (release 2025-07-30).
security-crypto = "1.1.0"
# Instrumented test (emulator CI): androidx.test latest verify qua Google Maven (2026-10-13).
androidx-test = "1.7.0"
test-ext-junit = "1.3.0"

[libraries]
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
# FFmpeg decoder cho format không phải FLAC (doc ma145 bắt buộc, vì MediaCodec
# của Android cắt 24-bit xuống 16-bit).
media3-ffmpeg-decoder = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version.ref = "media3-ffmpeg-decoder" }
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
# 1.2: mã hoá token (EncryptedSharedPreferences, MasterKey AES-256-GCM).
security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
# 1.4: Phase 1 Libraries (Coil ảnh bìa + OkHttp + serialization).
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization-json" }
# Instrumented test (chạy trên emulator CI).
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidx-test" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 1.4: kotlinx.serialization — version = Kotlin version (2.2.20).
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
