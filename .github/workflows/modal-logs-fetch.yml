name: Fetch Modal Logs (one-off)

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Modal app name"
        required: false
        default: "stock-tick-collector"

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modal CLI
        run: pip install modal

      - name: Capture windowed logs with timestamps
        run: |
          mkdir -p modal-logs-out
          modal app logs "${{ inputs.app_name }}" --since 2026-10-27T07:20:00 --until 2026-10-27T08:05:00 --timestamps --show-function-id --show-container-id --tail 1000 > modal-logs-out/app-logs-windowed.txt 2>&1 || echo "exit=$?" >> modal-logs-out/app-logs-windowed.txt
          wc -l -c modal-logs-out/app-logs-windowed.txt
          echo "===== BEGIN app-logs-windowed.txt ====="
          cat modal-logs-out/app-logs-windowed.txt
          echo "===== END app-logs-windowed.txt ====="

      - name: Upload logs artifact
        uses: actions/upload-artifact@v4
        with:
          name: modal-logs-windowed-20261027
          path: modal-logs-out/
