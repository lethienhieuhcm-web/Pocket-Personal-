name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'js/**'
      - '*.html'
      - '*.css'
      - 'icons/**'
      - 'scripts/cf_deploy.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install worker dependencies
        # Fix 15/10/2026: worker/build.sh chay npx esbuild, can resolve
        # drizzle-orm tu node_modules - thieu npm ci la build fail ngay
        # (cung goc benh voi #5).
        run: |
          cd worker
          npm ci

      - name: Install visual gate dependencies
        # Cổng so ảnh (tests/visual/gate.js) chạy trong cf_deploy sau deploy:
        # cần playwright + Chromium ngay trong CI. Thiếu bước này capture.js
        # crash "Cannot find module 'playwright'" -> deploy báo đỏ giả
        # (chuỗi 8 run fail 22/10/2026). npm ci theo package-lock của
        # tests/visual; playwright install lấy đúng bản Chromium theo lock.
        run: |
          cd tests/visual
          npm ci
          npx playwright install --with-deps chromium

      - name: Deploy via cf_deploy.py
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_DEPLOY_SRC: ${{ github.workspace }}
        run: |
          python3 scripts/cf_deploy.py
